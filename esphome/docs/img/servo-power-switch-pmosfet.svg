<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" font-family="Consolas, Menlo, monospace" font-size="15">
  <rect x="0" y="0" width="980" height="720" fill="#ffffff"/>

  <!-- Titulo -->
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#111">Corte de servos por el positivo: IPP120P04P4L-03 + PN2222A</text>

  <!-- Rail BAT+ hasta el source del P-MOSFET -->
  <text x="60" y="72" fill="#111">BAT+ (bateria 1S, 3.0-4.2V)</text>
  <line x1="60" y1="85" x2="330" y2="85" stroke="#111" stroke-width="2"/>
  <circle cx="250" cy="85" r="4" fill="#111"/>

  <!-- P-MOSFET IPP120P04P4L-03 -->
  <rect x="330" y="55" width="150" height="70" fill="#f5f5f5" stroke="#111" stroke-width="2"/>
  <text x="338" y="82" font-weight="bold" fill="#111">IPP120P04P4L-03</text>
  <text x="362" y="104" fill="#333" font-size="13">(4PP04L03)</text>
  <text x="314" y="78" fill="#333" font-size="13">S</text>
  <text x="486" y="78" fill="#333" font-size="13">D</text>
  <text x="412" y="145" fill="#333" font-size="13">G</text>

  <!-- Drain -> VIN del TPS61088 -->
  <line x1="480" y1="85" x2="560" y2="85" stroke="#111" stroke-width="2"/>

  <!-- TPS61088 -->
  <rect x="560" y="55" width="170" height="110" fill="#f5f5f5" stroke="#111" stroke-width="2"/>
  <text x="566" y="80" fill="#333" font-size="13">VIN</text>
  <text x="690" y="80" fill="#333" font-size="13">VOUT</text>
  <text x="603" y="110" font-weight="bold" fill="#111">TPS61088</text>
  <text x="576" y="132" fill="#555" font-size="12">pad PWM abierto</text>
  <text x="600" y="150" fill="#555" font-size="12">(modo PFM)</text>
  <text x="652" y="182" fill="#333" font-size="13">GND</text>
  <line x1="645" y1="165" x2="645" y2="560" stroke="#111" stroke-width="2"/>

  <!-- Riel +5V servos -->
  <text x="742" y="72" fill="#111">+5V servos</text>
  <line x1="730" y1="85" x2="900" y2="85" stroke="#111" stroke-width="2"/>
  <circle cx="790" cy="85" r="4" fill="#111"/>

  <!-- Condensador electrolitico junto a los servos -->
  <line x1="790" y1="85" x2="790" y2="215" stroke="#111" stroke-width="2"/>
  <line x1="772" y1="215" x2="808" y2="215" stroke="#111" stroke-width="3"/>
  <line x1="772" y1="227" x2="808" y2="227" stroke="#111" stroke-width="3"/>
  <line x1="790" y1="227" x2="790" y2="560" stroke="#111" stroke-width="2"/>
  <text x="780" y="200" fill="#111" font-size="13" text-anchor="end">1000-2200uF</text>
  <text x="780" y="250" fill="#555" font-size="12" text-anchor="end">junto a servos</text>

  <!-- Servos -->
  <line x1="900" y1="85" x2="900" y2="250" stroke="#111" stroke-width="2"/>
  <rect x="820" y="250" width="140" height="90" fill="#f5f5f5" stroke="#111" stroke-width="2"/>
  <text x="835" y="280" font-weight="bold" fill="#111">Servos</text>
  <text x="835" y="300" fill="#333">pan / tilt</text>
  <text x="830" y="325" fill="#333" font-size="13">V+ GND senal</text>
  <line x1="840" y1="340" x2="840" y2="560" stroke="#111" stroke-width="2"/>

  <!-- Senal PWM (ya existente, otro GPIO) -->
  <line x1="940" y1="340" x2="940" y2="420" stroke="#888" stroke-width="2" stroke-dasharray="6,4"/>
  <rect x="865" y="420" width="110" height="44" fill="#fff8e6" stroke="#a88" stroke-width="1.5"/>
  <text x="872" y="438" fill="#663" font-size="13">Senal PWM</text>
  <text x="872" y="455" fill="#663" font-size="13">(otro GPIO)</text>

  <!-- R1 10k: puerta -> BAT+ -->
  <line x1="250" y1="85" x2="250" y2="130" stroke="#111" stroke-width="2"/>
  <rect x="238" y="130" width="24" height="50" fill="#fff" stroke="#111" stroke-width="2"/>
  <line x1="250" y1="180" x2="250" y2="205" stroke="#111" stroke-width="2"/>
  <text x="230" y="160" fill="#111" font-size="13" text-anchor="end">R1 10k</text>
  <line x1="250" y1="205" x2="405" y2="205" stroke="#111" stroke-width="2"/>

  <!-- Puerta del P-MOSFET -->
  <line x1="405" y1="125" x2="405" y2="250" stroke="#111" stroke-width="2"/>
  <circle cx="405" cy="205" r="4" fill="#111"/>

  <!-- PN2222A -->
  <rect x="365" y="250" width="110" height="80" fill="#f5f5f5" stroke="#111" stroke-width="2"/>
  <text x="378" y="284" font-weight="bold" fill="#111">PN2222A</text>
  <text x="381" y="305" fill="#333" font-size="13">(2N2222)</text>
  <text x="412" y="245" fill="#333" font-size="13">C</text>
  <text x="350" y="282" fill="#333" font-size="13">B</text>
  <text x="412" y="348" fill="#333" font-size="13">E</text>
  <line x1="405" y1="330" x2="405" y2="560" stroke="#111" stroke-width="2"/>

  <!-- Base: R2 1k desde el GPIO y R3 10k a GND -->
  <line x1="365" y1="290" x2="260" y2="290" stroke="#111" stroke-width="2"/>
  <circle cx="300" cy="290" r="4" fill="#111"/>
  <rect x="200" y="278" width="60" height="24" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="205" y="270" fill="#111" font-size="13">R2 1k</text>
  <line x1="200" y1="290" x2="150" y2="290" stroke="#111" stroke-width="2"/>
  <rect x="60" y="268" width="90" height="44" fill="#e8f0ff" stroke="#111" stroke-width="2"/>
  <text x="84" y="287" fill="#111">GPIO</text>
  <text x="81" y="304" fill="#333" font-size="12">ESP32-S3</text>

  <line x1="300" y1="290" x2="300" y2="380" stroke="#111" stroke-width="2"/>
  <rect x="288" y="380" width="24" height="50" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="320" y="410" fill="#111" font-size="13">R3 10k</text>
  <line x1="300" y1="430" x2="300" y2="560" stroke="#111" stroke-width="2"/>

  <!-- GND comun -->
  <line x1="60" y1="560" x2="960" y2="560" stroke="#111" stroke-width="2"/>
  <text x="60" y="585" fill="#111">GND comun (bateria, ESP32, TPS61088, servos)</text>
  <circle cx="300" cy="560" r="4" fill="#111"/>
  <circle cx="405" cy="560" r="4" fill="#111"/>
  <circle cx="645" cy="560" r="4" fill="#111"/>
  <circle cx="790" cy="560" r="4" fill="#111"/>
  <circle cx="840" cy="560" r="4" fill="#111"/>

  <!-- Notas -->
  <rect x="60" y="605" width="460" height="95" fill="#f7f7f7" stroke="#999" stroke-width="1.5"/>
  <text x="72" y="628" fill="#111" font-weight="bold" font-size="14">Como funciona</text>
  <text x="72" y="652" fill="#333" font-size="13">GPIO=1 -&gt; PN2222A satura -&gt; G=0V -&gt; IPP120 conduce</text>
  <text x="72" y="672" fill="#333" font-size="13">GPIO=0 o flotando (deep sleep) -&gt; R3 corta el NPN,</text>
  <text x="72" y="690" fill="#333" font-size="13">R1 sube G a BAT+ -&gt; boost y servos apagados</text>

  <rect x="540" y="605" width="420" height="95" fill="#eef7ee" stroke="#3a6" stroke-width="1.5"/>
  <text x="552" y="628" fill="#153" font-weight="bold" font-size="14">Orden correcto al apagar</text>
  <text x="552" y="652" fill="#153" font-size="13">1) ESPHome deja de mandar PWM (auto_detach)</text>
  <text x="552" y="672" fill="#153" font-size="13">2) Despues, GPIO de corte a 0</text>
  <text x="552" y="690" fill="#153" font-size="13">(no cortar con la senal PWM activa)</text>
</svg>
