<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" font-family="Consolas, Menlo, monospace" font-size="15">
  <rect x="0" y="0" width="980" height="720" fill="#ffffff"/>

  <!-- Titulo -->
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#111">Disparo de la pistola por el positivo: IPP120P04P4L-03 + PN2222A</text>

  <!-- Rail BAT+ hasta el source del P-MOSFET -->
  <text x="60" y="72" fill="#111">BAT+ (bateria 1S, 3.0-4.2V)</text>
  <line x1="60" y1="85" x2="330" y2="85" stroke="#111" stroke-width="2"/>
  <circle cx="250" cy="85" r="4" fill="#111"/>

  <!-- P-MOSFET IPP120P04P4L-03 -->
  <rect x="330" y="55" width="150" height="70" fill="#f5f5f5" stroke="#111" stroke-width="2"/>
  <text x="338" y="82" font-weight="bold" fill="#111">IPP120P04P4L-03</text>
  <text x="362" y="104" fill="#333" font-size="13">(4PP04L03)</text>
  <text x="314" y="78" fill="#333" font-size="13">S</text>
  <text x="486" y="78" fill="#333" font-size="13">D</text>
  <text x="412" y="145" fill="#333" font-size="13">G</text>

  <!-- Drain -> + del motor -->
  <text x="560" y="72" fill="#111">+ motor</text>
  <line x1="480" y1="85" x2="680" y2="85" stroke="#111" stroke-width="2"/>
  <line x1="680" y1="85" x2="680" y2="230" stroke="#111" stroke-width="2"/>
  <circle cx="680" cy="150" r="4" fill="#111"/>

  <!-- Motor ZC005 -->
  <rect x="605" y="230" width="150" height="90" fill="#f5f5f5" stroke="#111" stroke-width="2"/>
  <text x="620" y="260" font-weight="bold" fill="#111">Motor ZC005</text>
  <text x="620" y="282" fill="#333" font-size="13">DC 3.7V ~0.9A</text>
  <text x="620" y="302" fill="#555" font-size="12">(pico 2.7-4.5A)</text>
  <line x1="680" y1="320" x2="680" y2="560" stroke="#111" stroke-width="2"/>
  <circle cx="680" cy="400" r="4" fill="#111"/>

  <!-- Rama del diodo y del condensador, en paralelo con el motor -->
  <line x1="680" y1="150" x2="900" y2="150" stroke="#111" stroke-width="2"/>
  <circle cx="810" cy="150" r="4" fill="#111"/>
  <line x1="680" y1="400" x2="900" y2="400" stroke="#111" stroke-width="2"/>
  <circle cx="810" cy="400" r="4" fill="#111"/>

  <!-- Diodo 1N4007, catodo arriba (hacia +) -->
  <line x1="810" y1="150" x2="810" y2="245" stroke="#111" stroke-width="2"/>
  <line x1="795" y1="245" x2="825" y2="245" stroke="#111" stroke-width="3"/>
  <polygon points="795,275 825,275 810,245" fill="#fff" stroke="#111" stroke-width="2"/>
  <line x1="810" y1="275" x2="810" y2="400" stroke="#111" stroke-width="2"/>
  <text x="700" y="428" fill="#111" font-size="13">Diodo 1N4007</text>
  <text x="700" y="447" fill="#555" font-size="12">franja (catodo) hacia el +</text>

  <!-- Condensador ceramico 104 -->
  <line x1="900" y1="150" x2="900" y2="262" stroke="#111" stroke-width="2"/>
  <line x1="882" y1="262" x2="918" y2="262" stroke="#111" stroke-width="3"/>
  <line x1="882" y1="274" x2="918" y2="274" stroke="#111" stroke-width="3"/>
  <line x1="900" y1="274" x2="900" y2="400" stroke="#111" stroke-width="2"/>
  <text x="926" y="262" fill="#111" font-size="13">104</text>
  <text x="926" y="280" fill="#555" font-size="12">100nF</text>

  <!-- R1 10k: puerta -> BAT+ -->
  <line x1="250" y1="85" x2="250" y2="130" stroke="#111" stroke-width="2"/>
  <rect x="238" y="130" width="24" height="50" fill="#fff" stroke="#111" stroke-width="2"/>
  <line x1="250" y1="180" x2="250" y2="205" stroke="#111" stroke-width="2"/>
  <text x="230" y="160" fill="#111" font-size="13" text-anchor="end">R1 10k</text>
  <line x1="250" y1="205" x2="405" y2="205" stroke="#111" stroke-width="2"/>

  <!-- Puerta del P-MOSFET -->
  <line x1="405" y1="125" x2="405" y2="250" stroke="#111" stroke-width="2"/>
  <circle cx="405" cy="205" r="4" fill="#111"/>

  <!-- PN2222A -->
  <rect x="365" y="250" width="110" height="80" fill="#f5f5f5" stroke="#111" stroke-width="2"/>
  <text x="378" y="284" font-weight="bold" fill="#111">PN2222A</text>
  <text x="381" y="305" fill="#333" font-size="13">(2N2222)</text>
  <text x="412" y="245" fill="#333" font-size="13">C</text>
  <text x="350" y="282" fill="#333" font-size="13">B</text>
  <text x="412" y="348" fill="#333" font-size="13">E</text>
  <line x1="405" y1="330" x2="405" y2="560" stroke="#111" stroke-width="2"/>

  <!-- Base: R2 1k desde el GPIO y R3 10k a GND -->
  <line x1="365" y1="290" x2="260" y2="290" stroke="#111" stroke-width="2"/>
  <circle cx="300" cy="290" r="4" fill="#111"/>
  <rect x="200" y="278" width="60" height="24" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="205" y="270" fill="#111" font-size="13">R2 1k</text>
  <line x1="200" y1="290" x2="150" y2="290" stroke="#111" stroke-width="2"/>
  <rect x="60" y="268" width="90" height="44" fill="#e8f0ff" stroke="#111" stroke-width="2"/>
  <text x="84" y="287" fill="#111">GPIO</text>
  <text x="81" y="304" fill="#333" font-size="12">ESP32-S3</text>

  <line x1="300" y1="290" x2="300" y2="380" stroke="#111" stroke-width="2"/>
  <rect x="288" y="380" width="24" height="50" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="320" y="410" fill="#111" font-size="13">R3 10k</text>
  <line x1="300" y1="430" x2="300" y2="560" stroke="#111" stroke-width="2"/>

  <!-- GND comun -->
  <line x1="60" y1="560" x2="960" y2="560" stroke="#111" stroke-width="2"/>
  <text x="60" y="585" fill="#111">GND comun (bateria, ESP32, motor)</text>
  <circle cx="300" cy="560" r="4" fill="#111"/>
  <circle cx="405" cy="560" r="4" fill="#111"/>
  <circle cx="680" cy="560" r="4" fill="#111"/>

  <!-- Notas -->
  <rect x="60" y="605" width="460" height="95" fill="#f7f7f7" stroke="#999" stroke-width="1.5"/>
  <text x="72" y="628" fill="#111" font-weight="bold" font-size="14">Como funciona</text>
  <text x="72" y="652" fill="#333" font-size="13">GPIO=1 -&gt; PN2222A satura -&gt; G=0V -&gt; motor gira</text>
  <text x="72" y="672" fill="#333" font-size="13">(las rafagas las hace el mecanismo: solo on/off)</text>
  <text x="72" y="690" fill="#333" font-size="13">GPIO=0 o flotando -&gt; R1 sube G -&gt; motor parado</text>

  <rect x="540" y="605" width="420" height="95" fill="#eef7ee" stroke="#3a6" stroke-width="1.5"/>
  <text x="552" y="628" fill="#153" font-weight="bold" font-size="14">Mismo circuito que el de los servos</text>
  <text x="552" y="652" fill="#153" font-size="13">Un solo tipo de MOSFET en todo el proyecto.</text>
  <text x="552" y="672" fill="#153" font-size="13">Alternativa: IRLZ44N cortando la GND del</text>
  <text x="552" y="690" fill="#153" font-size="13">motor (ver water-gun-switch-irlz44n.svg)</text>
</svg>
