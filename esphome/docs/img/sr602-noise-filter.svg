<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 570" font-family="Consolas, Menlo, monospace" font-size="15">
  <rect x="0" y="0" width="1080" height="570" fill="#ffffff"/>

  <!-- Title -->
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#111">Filtrado de ruido del PIR SR602 (montaje en caja con la ESP32-S3)</text>

  <!-- +3V3 rail -->
  <line x1="60" y1="80" x2="1020" y2="80" stroke="#111" stroke-width="2"/>
  <text x="20" y="85" fill="#111">3V3</text>
  <text x="560" y="70" fill="#555" font-size="13">(riel 3.3V del TPS63020: fuente conmutada, con rizado)</text>

  <!-- Drop from rail to series ferrite -->
  <line x1="300" y1="80" x2="300" y2="130" stroke="#111" stroke-width="2"/>

  <!-- Series ferrite / 100 ohm (optional) -->
  <rect x="285" y="130" width="30" height="50" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="325" y="150" fill="#111">Ferrita / R 100ohm</text>
  <text x="325" y="168" fill="#555" font-size="13">(opcional, si C1/C2 no bastan)</text>
  <line x1="300" y1="180" x2="300" y2="230" stroke="#111" stroke-width="2"/>

  <!-- + line into sensor -->
  <line x1="300" y1="230" x2="520" y2="230" stroke="#111" stroke-width="2"/>
  <!-- - line from sensor -->
  <line x1="380" y1="290" x2="520" y2="290" stroke="#111" stroke-width="2"/>
  <!-- - line down to GND -->
  <line x1="380" y1="290" x2="380" y2="500" stroke="#111" stroke-width="2"/>

  <!-- C1 100nF ceramic -->
  <line x1="380" y1="230" x2="380" y2="252" stroke="#111" stroke-width="2"/>
  <line x1="368" y1="252" x2="392" y2="252" stroke="#111" stroke-width="3"/>
  <line x1="368" y1="266" x2="392" y2="266" stroke="#111" stroke-width="3"/>
  <line x1="380" y1="266" x2="380" y2="290" stroke="#111" stroke-width="2"/>

  <!-- C2 10-100uF electrolytic (+ up) -->
  <line x1="450" y1="230" x2="450" y2="252" stroke="#111" stroke-width="2"/>
  <line x1="438" y1="252" x2="462" y2="252" stroke="#111" stroke-width="3"/>
  <rect x="438" y="262" width="24" height="5" fill="#111" stroke="none"/>
  <line x1="450" y1="267" x2="450" y2="290" stroke="#111" stroke-width="2"/>
  <text x="466" y="250" fill="#111" font-size="13">+</text>

  <!-- junction dots -->
  <circle cx="380" cy="230" r="4" fill="#111"/>
  <circle cx="450" cy="230" r="4" fill="#111"/>
  <circle cx="380" cy="290" r="4" fill="#111"/>
  <circle cx="450" cy="290" r="4" fill="#111"/>

  <!-- capacitor labels -->
  <text x="303" y="316" fill="#111">C1 100nF</text>
  <text x="303" y="334" fill="#555" font-size="13">ceramico</text>
  <text x="420" y="316" fill="#111">C2 10-100uF</text>
  <text x="420" y="334" fill="#555" font-size="13">electrolitico, + arriba</text>

  <!-- Sensor block -->
  <rect x="520" y="205" width="200" height="115" fill="#f5f5f5" stroke="#111" stroke-width="2"/>
  <text x="560" y="265" fill="#111" font-weight="bold">SR602 (HW-438)</text>
  <text x="528" y="235" fill="#333" font-size="13">+</text>
  <text x="528" y="295" fill="#333" font-size="13">-</text>
  <text x="682" y="260" fill="#333" font-size="13">OUT</text>
  <!-- Fresnel lens on top (sticks out of the shield) -->
  <path d="M 605 205 A 15 15 0 0 1 635 205" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="645" y="198" fill="#555" font-size="13">lente</text>

  <!-- Foil shield (open at the top, lens outside) -->
  <polyline points="290,195 290,345 735,345 735,195" fill="none" stroke="#777" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="395" y="365" fill="#777" font-size="13">papel de aluminio a GND alrededor del modulo (lente fuera)</text>
  <line x1="290" y1="345" x2="290" y2="500" stroke="#777" stroke-width="2" stroke-dasharray="8,5"/>

  <!-- OUT wire to GPIO14 -->
  <line x1="720" y1="255" x2="780" y2="255" stroke="#111" stroke-width="2"/>
  <line x1="780" y1="255" x2="780" y2="400" stroke="#111" stroke-width="2"/>

  <!-- C3 10nF optional on OUT -->
  <circle cx="780" cy="330" r="4" fill="#111"/>
  <line x1="780" y1="330" x2="900" y2="330" stroke="#111" stroke-width="2"/>
  <line x1="900" y1="330" x2="900" y2="400" stroke="#111" stroke-width="2"/>
  <line x1="888" y1="400" x2="912" y2="400" stroke="#111" stroke-width="3"/>
  <line x1="888" y1="414" x2="912" y2="414" stroke="#111" stroke-width="3"/>
  <line x1="900" y1="414" x2="900" y2="500" stroke="#111" stroke-width="2"/>
  <text x="915" y="352" fill="#111">C3 10nF opcional</text>
  <text x="915" y="370" fill="#555" font-size="13">(cable OUT largo)</text>

  <!-- ESP32-S3 block -->
  <rect x="730" y="400" width="130" height="70" fill="#e8f0ff" stroke="#111" stroke-width="2"/>
  <text x="742" y="422" fill="#111" font-weight="bold" font-size="13">ESP32-S3</text>
  <text x="742" y="441" fill="#111" font-size="13">GPIO14 (RTC)</text>
  <text x="742" y="459" fill="#555" font-size="12">INPUT_PULLDOWN</text>
  <line x1="795" y1="470" x2="795" y2="500" stroke="#111" stroke-width="2"/>

  <!-- GND rail -->
  <line x1="60" y1="500" x2="1020" y2="500" stroke="#111" stroke-width="2"/>
  <text x="20" y="505" fill="#111">GND</text>

  <!-- Notes -->
  <text x="20" y="535" fill="#333" font-size="13">C1 y C2 van soldados a menos de 2cm de los pines +/- del sensor, no en la placa ni en el regulador.</text>
  <text x="20" y="553" fill="#333" font-size="13">Sensor lo mas lejos posible de la antena WiFi, de los servos y del TPS63020; la lente asomando fuera de la caja.</text>
</svg>
