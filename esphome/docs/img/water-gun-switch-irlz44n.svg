<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" font-family="Consolas, Menlo, monospace" font-size="15">
  <rect x="0" y="0" width="920" height="600" fill="#ffffff"/>

  <!-- Titulo -->
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#111">Disparo de la pistola por GND: IRLZ44N (interruptor de bajo lado)</text>

  <!-- Rail BAT+ -->
  <text x="60" y="60" fill="#111">BAT+ (bateria 1S, 3.0-4.2V)</text>
  <line x1="60" y1="72" x2="300" y2="72" stroke="#111" stroke-width="2"/>
  <circle cx="260" cy="72" r="4" fill="#111"/>

  <!-- + del motor -->
  <line x1="260" y1="72" x2="260" y2="130" stroke="#111" stroke-width="2"/>
  <circle cx="260" cy="100" r="4" fill="#111"/>

  <!-- Motor ZC005 -->
  <rect x="180" y="130" width="160" height="90" fill="#f5f5f5" stroke="#111" stroke-width="2"/>
  <text x="195" y="160" font-weight="bold" fill="#111">Motor ZC005</text>
  <text x="195" y="182" fill="#333" font-size="13">DC 3.7V ~0.9A</text>
  <text x="195" y="202" fill="#555" font-size="12">(pico 2.7-4.5A)</text>

  <!-- - del motor hacia el drenador -->
  <line x1="260" y1="220" x2="260" y2="330" stroke="#111" stroke-width="2"/>
  <circle cx="260" cy="260" r="4" fill="#111"/>

  <!-- Rama del diodo y del condensador, en paralelo con el motor -->
  <line x1="260" y1="100" x2="520" y2="100" stroke="#111" stroke-width="2"/>
  <circle cx="430" cy="100" r="4" fill="#111"/>
  <line x1="260" y1="260" x2="520" y2="260" stroke="#111" stroke-width="2"/>
  <circle cx="430" cy="260" r="4" fill="#111"/>

  <!-- Diodo 1N4007, catodo arriba (hacia +) -->
  <line x1="430" y1="100" x2="430" y2="160" stroke="#111" stroke-width="2"/>
  <line x1="415" y1="160" x2="445" y2="160" stroke="#111" stroke-width="3"/>
  <polygon points="415,190 445,190 430,160" fill="#fff" stroke="#111" stroke-width="2"/>
  <line x1="430" y1="190" x2="430" y2="260" stroke="#111" stroke-width="2"/>

  <!-- Condensador ceramico 104 -->
  <line x1="520" y1="100" x2="520" y2="172" stroke="#111" stroke-width="2"/>
  <line x1="502" y1="172" x2="538" y2="172" stroke="#111" stroke-width="3"/>
  <line x1="502" y1="184" x2="538" y2="184" stroke="#111" stroke-width="3"/>
  <line x1="520" y1="184" x2="520" y2="260" stroke="#111" stroke-width="2"/>
  <text x="546" y="174" fill="#111" font-size="13">104</text>
  <text x="546" y="192" fill="#555" font-size="12">100nF</text>

  <text x="280" y="286" fill="#111" font-size="13">Diodo 1N4007: franja (catodo) hacia el +</text>

  <!-- IRLZ44N -->
  <rect x="215" y="330" width="90" height="90" fill="#f5f5f5" stroke="#111" stroke-width="2"/>
  <text x="225" y="370" font-weight="bold" fill="#111">IRLZ44N</text>
  <text x="268" y="325" fill="#333" font-size="13">D</text>
  <text x="268" y="440" fill="#333" font-size="13">S</text>
  <text x="222" y="400" fill="#333" font-size="13">G</text>

  <!-- Source a GND -->
  <line x1="260" y1="420" x2="260" y2="520" stroke="#111" stroke-width="2"/>

  <!-- Puerta: R 220ohm desde el GPIO y pull-down de 10k -->
  <line x1="215" y1="375" x2="160" y2="375" stroke="#111" stroke-width="2"/>
  <rect x="110" y="363" width="50" height="24" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="105" y="355" fill="#111" font-size="13">R 220ohm</text>
  <line x1="110" y1="375" x2="60" y2="375" stroke="#111" stroke-width="2"/>
  <circle cx="85" cy="375" r="4" fill="#111"/>
  <rect x="20" y="355" width="40" height="40" fill="#e8f0ff" stroke="#111" stroke-width="2"/>
  <text x="24" y="379" fill="#111" font-size="12">GPIO</text>

  <line x1="85" y1="375" x2="85" y2="430" stroke="#111" stroke-width="2"/>
  <rect x="73" y="430" width="24" height="50" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="105" y="460" fill="#111" font-size="13">R 10k (pull-down)</text>
  <line x1="85" y1="480" x2="85" y2="520" stroke="#111" stroke-width="2"/>

  <!-- GND comun -->
  <line x1="20" y1="520" x2="900" y2="520" stroke="#111" stroke-width="2"/>
  <text x="20" y="545" fill="#111">GND comun (bateria, ESP32)</text>
  <circle cx="85" cy="520" r="4" fill="#111"/>
  <circle cx="260" cy="520" r="4" fill="#111"/>

  <!-- Nota: por que vale aqui y no en los servos -->
  <rect x="580" y="300" width="320" height="170" fill="#fff8e6" stroke="#a88" stroke-width="1.5"/>
  <text x="592" y="324" fill="#663" font-weight="bold" font-size="14">Corte por GND (bajo lado)</text>
  <text x="592" y="348" fill="#663" font-size="13">Vale para la pistola: el motor</text>
  <text x="592" y="366" fill="#663" font-size="13">solo tiene 2 cables y ninguno</text>
  <text x="592" y="384" fill="#663" font-size="13">va al ESP32.</text>
  <text x="592" y="412" fill="#663" font-size="13">NO vale para los servos: buscan</text>
  <text x="592" y="430" fill="#663" font-size="13">masa por la senal PWM (ver</text>
  <text x="592" y="448" fill="#663" font-size="13">servo-power-switch-pmosfet.svg)</text>

  <text x="20" y="580" fill="#555" font-size="13">GPIO=1 -&gt; IRLZ44N conduce -&gt; motor gira (rafagas por el mecanismo). GPIO=0 o flotando -&gt; parado.</text>
</svg>
