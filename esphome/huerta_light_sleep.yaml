# -----------------------------------------------------------------------------
# VARIANTE "always-on + light sleep" del sistema huerta.
#
# Diferencia clave respecto al huerta.yaml original:
#   - Ya NO hay deep_sleep. El chip está siempre despierto, pero ESP-IDF mete
#     el core en light sleep automático en los huecos de inactividad del
#     scheduler (esp_pm_configure), lo que en teoría mantiene la sesión WiFi
#     asociada sin la reasociación completa que sufrías tras deep_sleep.
#   - El PIR deja de ser "wakeup source" y pasa a ser un sensor normal más
#     (ya no necesitas pull-down manual en el arranque para eso, aunque se
#     mantiene el mismo binary_sensor).
#   - Se añade un servicio de la API (`set_servo_position`) para que tu script
#     Python pueda pilotar pan/tilt sin pasar por Home Assistant.
#   - Se añade un webhook `on_connect` que avisa a tu servidor Python en
#     cuanto el ESP32 tiene IP (útil sobre todo tras un reinicio/OTA, ya que
#     en el resto del tiempo el dispositivo no se desconecta).
#
# PENDIENTE DE VALIDAR EN TU HARDWARE FINAL (no en el devkit por USB-JTAG):
#   - Consumo real en reposo con light sleep continuo vs. deep sleep + tus
#     ~50 activaciones/día. Si el consumo sostenido es demasiado alto para tu
#     batería/panel solar, vuelve al modelo de huerta.yaml original.
#   - Estabilidad de esp32_camera_web_server y de la API bajo light sleep
#     continuo durante horas (streams cortados, timeouts, etc.) — no hay
#     mucha experiencia de la comunidad combinando esto con cámara.
#
# Pines de servo (GPIOxx) son PLACEHOLDER — ajusta a los pines reales que
# vayas a usar en tu placa para pan/tilt.

# fue un desastre, no se pudo hacer funcionar el light sleep con la cámara y el servidor web, así que se volvió al deep sleep original. Se deja este archivo como referencia para futuras pruebas.
# -----------------------------------------------------------------------------

globals:
  - id: pir_gpio
    type: int
    initial_value: '14'

esphome:
  name: huerta
  friendly_name: huerta
  includes:
    - esp_pm_local.h
  on_boot:
    priority: -100
    then:
      - lambda: |-
          // Light sleep automático (ESP-IDF power management).
          // El scheduler mete el core a dormir en los huecos de inactividad
          // sin desconectar WiFi (a diferencia de deep_sleep).
          esp_pm_config_t pm_config = {
              .max_freq_mhz = 160,
              .min_freq_mhz = 40,
              .light_sleep_enable = true
          };
          esp_err_t err = esp_pm_configure(&pm_config);
          if (err == ESP_OK) {
            ESP_LOGI("pm", "esp_pm_configure OK: light sleep habilitado");
          } else {
            ESP_LOGE("pm", "esp_pm_configure FALLO: %s", esp_err_to_name(err));
          }

          // PIR como entrada normal (ya no es wakeup_pin, pero seguimos
          // leyendo el mismo GPIO como sensor de presencia).
          gpio_set_direction((gpio_num_t)id(pir_gpio), GPIO_MODE_INPUT);
          gpio_set_pull_mode((gpio_num_t)id(pir_gpio), GPIO_PULLDOWN_ONLY);

          // Ajustes de imagen y exposición (igual que en el original).
          id(esp32_s3_cam)->set_ae_level((int) id(cam_ae_level).state);
          id(esp32_s3_cam)->set_aec2(id(cam_aec2).state);
          id(esp32_s3_cam)->set_agc_gain_ceiling(
            (esphome::esp32_camera::ESP32AgcGainCeiling)((int)id(cam_gain_ceiling).state)
          );
          id(esp32_s3_cam)->update_camera_parameters();

          if (id(cam_max_framerate).state > 0) {
            id(esp32_s3_cam)->set_max_update_interval(
              (uint32_t)(1000.0f / id(cam_max_framerate).state)
            );
          }

          sensor_t *s = esp_camera_sensor_get();
          if (s != nullptr) {
            s->set_quality(s, (int) id(cam_jpeg_quality).state);
            s->set_xclk(s, LEDC_TIMER_0, (int) id(cam_xclk_mhz).state);

            std::string res = id(cam_resolution).current_option().str();
            framesize_t frame = FRAMESIZE_VGA;

            if (res == "QVGA (320x240)") frame = FRAMESIZE_QVGA;
            else if (res == "VGA (640x480)") frame = FRAMESIZE_VGA;
            else if (res == "SVGA (800x600)") frame = FRAMESIZE_SVGA;
            else if (res == "HD (1280x720)") frame = FRAMESIZE_HD;
            else if (res == "UXGA (1600x1200)") frame = FRAMESIZE_UXGA;

            s->set_framesize(s, frame);
          }
      - logger.log: "on_boot: parameters configured (light sleep mode)"

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_PM_ENABLE: "y"
      CONFIG_FREERTOS_USE_TICKLESS_IDLE: "y"
      CONFIG_PM_DFS_INIT_AUTO: "y"
      CONFIG_ESP_WIFI_STA_DISCONNECTED_PM_ENABLE: "y"

psram:
  mode: octal
  speed: 80MHz

logger:
# Descomentar en producción para reducir consumo cpu/ram (se sigue viendo por wifi)
#  baud_rate: 0

# -----------------------------------------------------------------------------
# API de ESPHome.
# - on_client_connected: igual que en el original, avisa a HA.
# - services: set_servo_position, para que tu script Python mueva pan/tilt
#   directamente sin pasar por Home Assistant.
# -----------------------------------------------------------------------------
api:
  encryption:
    key: "JzwVvMMnr1H0kAtYHDnWKfZ/7L0RYVqOeGjWxwpIzRc="
  on_client_connected:
    then:
      - delay: 100ms
      - logger.log: "api: client connected, sending huerta_estado ON"
      - lambda: |-
          id(huerta_estado).publish_state("on");
      - homeassistant.event:
          event: esphome.huerta_estado
          data:
            state: "on"
  # services:
  #   - service: set_servo_position
  #     variables:
  #       pan: float
  #       tilt: float
  #     then:
  #       - servo.write:
  #           id: servo_pan
  #           level: !lambda 'return pan;'
  #       - servo.write:
  #           id: servo_tilt
  #           level: !lambda 'return tilt;'

ota:
  - platform: esphome
    password: "52d59cde2cd591419861f88c7b82d0aa"

# -----------------------------------------------------------------------------
# Necesario para el webhook on_connect hacia tu servidor Python.
# -----------------------------------------------------------------------------
http_request:
  timeout: 2s

# -----------------------------------------------------------------------------
# Conectividad Wi‑Fi.
# - power_save_mode: none sigue teniendo sentido aquí: como ya no dependemos
#   de deep_sleep para ahorrar, queremos la radio a máximo rendimiento para
#   no añadir más latencia de la necesaria en el tracking.
# - on_connect avisa a tu Python (útil sobre todo tras boot/OTA/reset).
# -----------------------------------------------------------------------------
wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      bssid: 78:C5:7D:14:E4:9C
      channel: 11

  power_save_mode: none
  output_power: 8.5
  fast_connect: true

  ap:
    ssid: "Huerta Fallback Hotspot"
    password: "teta1234"

  on_connect:
    - logger.log: "WiFi connected"
    # - http_request.post:
    #     url: "http://192.168.1.42:8080/esp-awake"
    #     on_error:
    #       - logger.log: "No se pudo avisar al servidor Python"
  on_disconnect:
    - logger.log: "WiFi disconnected (con light sleep esto NO debería pasar solo)"

  manual_ip:
    static_ip: 192.168.1.51
    gateway: 192.168.1.1
    subnet: 255.255.255.0
    dns1: 192.168.1.1
    dns2: 1.1.1.1

# Configuración de I2C para la cámara.
i2c:
  id: i2c_bus
  sda: GPIO4
  scl: GPIO5

esp32_camera:
  name: "ESP32 S3 Cam Huerta"
  id: esp32_s3_cam
  external_clock:
    pin: GPIO15
    frequency: 13MHz
  i2c_id: i2c_bus
  data_pins: [GPIO11, GPIO9, GPIO8, GPIO10, GPIO12, GPIO18, GPIO17, GPIO16]  # D0..D7
  vsync_pin: GPIO6
  href_pin: GPIO7
  pixel_clock_pin: GPIO13

  resolution: 1600X1200
  frame_buffer_count: 2
  idle_framerate: 0.1 fps
  vertical_flip: false
  horizontal_mirror: false

esp32_camera_web_server:
  - port: 8080
    mode: stream
  - port: 8081
    mode: snapshot

captive_portal:
safe_mode:

# -----------------------------------------------------------------------------
# PIR: ahora es solo un sensor normal (ya no es wakeup source de nada).
# -----------------------------------------------------------------------------
binary_sensor:
  - platform: template
    name: "PIR Motion"
    id: pir_motion
    device_class: motion
    lambda: |-
      return (gpio_get_level((gpio_num_t)id(pir_gpio)) == 1);
    filters:
      - delayed_off: 2s

text_sensor:
  - platform: template
    name: "Huerta Estado"
    id: huerta_estado
    entity_category: diagnostic

# -----------------------------------------------------------------------------
# Servos de pan/tilt.
# PLACEHOLDER: ajusta GPIOxx a los pines reales que uses para los servos.
# -----------------------------------------------------------------------------
# output:
#   - platform: ledc
#     pin: GPIOxx  # <-- ajustar: pin real del servo pan
#     id: pwm_pan
#     frequency: 50Hz
#   - platform: ledc
#     pin: GPIOxx  # <-- ajustar: pin real del servo tilt
#     id: pwm_tilt
#     frequency: 50Hz

# servo:
#   - id: servo_pan
#     output: pwm_pan
#     min_level: 3%
#     max_level: 12%
#   - id: servo_tilt
#     output: pwm_tilt
#     min_level: 3%
#     max_level: 12%

number:
  - platform: template
    name: "Cam XCLK (MHz)"
    id: cam_xclk_mhz
    min_value: 8
    max_value: 24
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 8
    set_action:
      - lambda: |-
          sensor_t *s = esp_camera_sensor_get();
          if (s != nullptr) {
            s->set_xclk(s, LEDC_TIMER_0, (int)x);
          }

  - platform: template
    name: "Cam JPEG Quality"
    id: cam_jpeg_quality
    min_value: 6
    max_value: 63
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 12
    set_action:
      - lambda: |-
          sensor_t *s = esp_camera_sensor_get();
          if (s != nullptr) {
            s->set_quality(s, (int)x);
          }

  - platform: template
    name: "Cam Max Framerate"
    id: cam_max_framerate
    min_value: 1
    max_value: 30
    step: 1
    unit_of_measurement: "fps"
    optimistic: true
    restore_value: true
    initial_value: 20
    set_action:
      - lambda: |-
          if (x > 0) {
            id(esp32_s3_cam)->set_max_update_interval((uint32_t)(1000.0f / x));
          }

  - platform: template
    name: "Cam AE Level"
    id: cam_ae_level
    min_value: -2
    max_value: 2
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 0
    set_action:
      - lambda: |-
          id(esp32_s3_cam)->set_ae_level((int) x);
          id(esp32_s3_cam)->update_camera_parameters();

  - platform: template
    name: "Cam AGC Gain Ceiling"
    id: cam_gain_ceiling
    min_value: 0
    max_value: 6
    step: 1
    optimistic: true
    restore_value: true
    set_action:
      - lambda: |-
          id(esp32_s3_cam)->set_agc_gain_ceiling(
            (esphome::esp32_camera::ESP32AgcGainCeiling)((int)x)
          );
          id(esp32_s3_cam)->update_camera_parameters();

select:
  - platform: template
    name: "Cam Resolution"
    id: cam_resolution
    options:
      - "QVGA (320x240)"
      - "VGA (640x480)"
      - "SVGA (800x600)"
      - "HD (1280x720)"
      - "UXGA (1600x1200)"
    initial_option: "VGA (640x480)"
    optimistic: true
    restore_value: true
    set_action:
      - lambda: |-
          sensor_t *s = esp_camera_sensor_get();
          if (s != nullptr) {
            framesize_t frame = FRAMESIZE_VGA;
            if (x == "QVGA (320x240)") frame = FRAMESIZE_QVGA;
            else if (x == "VGA (640x480)") frame = FRAMESIZE_VGA;
            else if (x == "SVGA (800x600)") frame = FRAMESIZE_SVGA;
            else if (x == "HD (1280x720)") frame = FRAMESIZE_HD;
            else if (x == "UXGA (1600x1200)") frame = FRAMESIZE_UXGA;
            s->set_framesize(s, frame);
          }

switch:
  - platform: template
    name: "Cam AEC2"
    id: cam_aec2
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: |-
          id(esp32_s3_cam)->set_aec2(true);
          id(esp32_s3_cam)->update_camera_parameters();
    turn_off_action:
      - lambda: |-
          id(esp32_s3_cam)->set_aec2(false);
          id(esp32_s3_cam)->update_camera_parameters();

button:
  - platform: restart
    name: "Restart"
    entity_category: config

  - platform: safe_mode
    name: "Safe Mode"
    internal: false
    entity_category: config

sensor:
  - platform: internal_temperature
    name: "Temperature"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    id: uptime_sensor
    entity_category: diagnostic
    internal: true

  - platform: wifi_signal
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"

# Componente personalizado (idéntico al original, no lo toques).
external_components:
  - source:
      type: local
      path: components
    components: [esp32_camera]
