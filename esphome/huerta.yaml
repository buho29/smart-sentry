# -----------------------------------------------------------------------------
# Sistema basado en ESP32-S3 con cámara y sensor PIR para funcionamiento exterior con baterías. 
# La placa permanece en deep sleep la mayor parte del tiempo y se activa solo cuando se detecta movimiento. 
# Tras la detección, el módulo puede permanecer activo durante un tiempo configurable para realizar capturas, 
# procesar información o enviar datos a un sistema central.
# -----------------------------------------------------------------------------

# INSTRUCCIONES RÁPIDAS
#
# 1) Configurar `secrets.yaml`
#    - Añade tus credenciales Wi‑Fi en `secrets.yaml` (keys: `wifi_ssid`, `wifi_password`).
#
# 2) Flashear y primera puesta en marcha
#    - Flashea con la CLI de ESPHome o con `esphome run huerta.yaml` por USB la primera vez.
#    - Observa el log serie para verificar que la cámara arranca y obtiene la IP fija.
#      Busca líneas: "Connected" y "IP Address: 192.168.1.50".
#
# 3) Pruebas rápidas después del boot
#    - Comprobar snapshot: abrir `http://192.168.1.50:8081` (snapshot) en un navegador.
#    - Comprobar stream: abrir `http://192.168.1.50:8080/` con VLC o Frigate.
#
# 4) Integración con Python/servicio de inferencia
#    - Tu servicio puede leer el stream HTTP directamente (puerto 8080).
#    - Tiene un binary_sensor `estado` en la API de ESPHome (ON/OFF)
#      para saber si la cámara está activa o dormida.
#    - Para controlar servos/actuadores en el ESP desde Python, usa la API de ESPHome
#      (`aioesphomeapi`) y la clave `api.encryption.key` definida abajo.
#
# 6) Ajustes operativos desde Home Assistant
#    - `Tiempo despierto (s)`: tiempo en segundos que el dispositivo queda despierto
#      tras una detección (cámbialo según batería/solar).
#    - `Cam Resolution`, `Cam JPEG Quality`, `Cam Max Framerate`, `Cam AE Level`,
#      `Cam AGC Gain Ceiling`, `Cam XCLK (MHz)`: parámetros ajustables en runtime.
#
# 7) Debug / Logs
#    - Para depurar, ejecuta `esphome logs huerta.yaml`.
#    - Busca: `api: client connected`, `WiFi connected`, `IP Address`, `Beginning sleep`.
#
# Resumen: usa el stream HTTP para inferencia rápida; usa la API solo para acciones
# (servos, relés) que deben ejecutar en el ESP.
# -----------------------------------------------------------------------------

globals:
  # Definimos el pin del PIR como variable global para reutilizarlo en lambdas.
  # Importante: el mismo GPIO también debe configurarse en deep_sleep como wakeup_pin.
  - id: pir_gpio
    type: int
    initial_value: '14'

esphome:
  name: huerta
  friendly_name: huerta
  # on_boot: se ejecuta después de que todos los componentes hayan hecho setup(), pero antes de que se inicie la API y el resto de servicios
  on_boot:
    priority: -100   # después de que la cámara, la API y el resto de componentes hayan hecho setup()
    then:
      - lambda: |-
          // Configurar pin PIR como INPUT_PULLDOWN al arrancar (ESP-IDF)
          gpio_set_direction((gpio_num_t)id(pir_gpio), GPIO_MODE_INPUT);
          // Configurar pull-down para el pin PIR
          gpio_set_pull_mode((gpio_num_t)id(pir_gpio), GPIO_PULLDOWN_ONLY);

          // Ajustes de imagen y exposición
          id(cam)->set_ae_level((int) id(cam_ae_level).state);
          id(cam)->set_aec2(id(cam_aec2).state);
          id(cam)->set_agc_gain_ceiling(
            (esphome::esp32_camera::ESP32AgcGainCeiling)((int)id(cam_gain_ceiling).state)
          );
          id(cam)->update_camera_parameters();

          if (id(cam_max_framerate).state > 0) {
            id(cam)->set_max_update_interval(
              (uint32_t)(1000.0f / id(cam_max_framerate).state)
            );
          }

          sensor_t *s = esp_camera_sensor_get();
          if (s != nullptr) {
            s->set_quality(s, (int) id(cam_jpeg_quality).state);
            s->set_xclk(s, LEDC_TIMER_0, (int) id(cam_xclk_mhz).state);

            std::string res = id(cam_resolution).current_option().str();
            framesize_t frame = FRAMESIZE_VGA;

            if (res == "QVGA (320x240)") frame = FRAMESIZE_QVGA;
            else if (res == "VGA (640x480)") frame = FRAMESIZE_VGA;
            else if (res == "SVGA (800x600)") frame = FRAMESIZE_SVGA;
            else if (res == "HD (1280x720)") frame = FRAMESIZE_HD;
            else if (res == "UXGA (1600x1200)") frame = FRAMESIZE_UXGA;

            s->set_framesize(s, frame);
          }
      - logger.log: "on_boot: parameters configured"

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    version: recommended

# -----------------------------------------------------------------------------
# Memoria PSRAM (RAM externa).
# - mode: octal -> bus de 8 líneas de datos en lugar de 4 (Quad): el doble de ancho de banda.
# - speed: 80MHz -> frecuencia de reloj del bus de memoria al máximo rendimiento soportado.
# -----------------------------------------------------------------------------
psram:
  mode: octal
  speed: 80MHz

# -----------------------------------------------------------------------------
# Logger.
# Para depurar, usa `esphome logs huerta.yaml`.
# baud_rate: 0 reduce el consumo de CPU/RAM al desactivar el log por serie.
# -----------------------------------------------------------------------------
logger:
  level: DEBUG
  logs:
    esp32_camera_web_server: WARN
#  baud_rate: 0

# -----------------------------------------------------------------------------
# API de ESPHome: sirve para comunicar el estado del dispositivo con el cliente
# (servicio Python vía aioesphomeapi, o Home Assistant). Cuando el cliente final
# conecta, se publica el binary_sensor estado=ON para indicar que el ESP
# está despierto y operativo.
# -----------------------------------------------------------------------------
api:
  encryption:
    key: "JzwVvMMnr1H0kAtYHDnWKfZ/7L0RYVqOeGjWxwpIzRc="
  on_client_connected:
    then:
      # delay de 100ms para que la API esté lista antes de enviar el estado
      - delay: 100ms
      - logger.log: "api: client connected, sending estado ON"
      - lambda: |-
          id(estado).publish_state(true);

# -----------------------------------------------------------------------------
# Actualizaciones inalámbricas (OTA - Over-The-Air).
# Permite flashear el firmware del ESP32 por Wi-Fi, sin conectar el dispositivo
# por cable USB al ordenador.
# -----------------------------------------------------------------------------
ota:
  - platform: esphome
    password: "52d59cde2cd591419861f88c7b82d0aa"

# -----------------------------------------------------------------------------
# Cliente HTTP.
# Se usa para avisar por POST al servidor Python cuando el ESP se conecta a la Wi‑Fi.
# -----------------------------------------------------------------------------
http_request:
  timeout: 2s
# -----------------------------------------------------------------------------
# Conectividad Wi‑Fi.
# - power_save_mode: none evita ahorrar energía en la radio para mejorar la respuesta.
# - fast_connect acelera la re-asociación tras despertar desde deep sleep.
# - (probando) manual_ip reduce el tiempo de DHCP y ayuda a evitar quedarse en el hotspot de fallback.
# - ap activa un AP local si la red principal no está disponible.
# -----------------------------------------------------------------------------
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  power_save_mode: none
  output_power: 8.5
  fast_connect: true

  ap:
    ssid: "Fallback Hotspot"
    password: "teta1234"

  on_connect:
    - logger.log: "WiFi connected"
    # Solo avisa al servidor Python si `server_awake_url` no está en blanco.
    - if:
        condition:
          lambda: "return !id(server_awake_url).state.empty();"
        then:
          - http_request.post:
              # La URL se lee en runtime del text `server_awake_url`, editable desde Home Assistant.
              url: !lambda "return id(server_awake_url).state;"
              on_error:
                - logger.log: "No se pudo avisar al servidor Python (no pasa nada, seguirá reintentando solo)"
  on_disconnect:
    - logger.log: "WiFi disconnected"

  #(probando)
  manual_ip:
    static_ip: 192.168.1.50
    gateway: 192.168.1.1
    subnet: 255.255.255.0
    dns1: 192.168.1.1
    dns2: 1.1.1.1


# -----------------------------------------------------------------------------
# Cámara ESP32-S3.
# Aquí se define el hardware de la cámara y su configuración base.
# La resolución, el framerate, la calidad JPEG y la exposición se ajustan en
# runtime desde Home Assistant para poder parametrizar el sistema sin recompilar.
# -----------------------------------------------------------------------------
# Configuración de I2C para la cámara.
i2c:
  id: i2c_bus
  sda: GPIO4
  scl: GPIO5

esp32_camera:
  name: "Cam"
  id: cam
  external_clock:
    pin: GPIO15
    frequency: 13MHz
  i2c_id: i2c_bus
  data_pins: [GPIO11, GPIO9, GPIO8, GPIO10, GPIO12, GPIO18, GPIO17, GPIO16]  # D0..D7
  vsync_pin: GPIO6
  href_pin: GPIO7
  pixel_clock_pin: GPIO13

  resolution: 1600X1200

  # frame_buffer_count: número de buffers de imagen que la cámara usa para almacenar frames antes de enviarlos.
  # Más buffers reducen pérdidas de frames y mejoran la fluidez en streaming, pero consumen más RAM/PSRAM.
  frame_buffer_count: 2
  
  idle_framerate: 0.1 fps
  vertical_flip: false
  horizontal_mirror: false

# -----------------------------------------------------------------------------
# Servidor web de la cámara.
# Permite acceder directamente al stream y a snapshot por HTTP sin depender de la
# API de ESPHome para la visualización de la imagen.
# -----------------------------------------------------------------------------
esp32_camera_web_server:
  - port: 8080
    mode: stream
  - port: 8081
    mode: snapshot

captive_portal:

# -----------------------------------------------------------------------------
# Modo seguro de recuperación (safe mode).
# Detecta fallos de arranque o reinicios en bucle (bootloops). En este modo:
# 1. Mantiene activa la conectividad Wi-Fi y la interfaz OTA.
# 2. Desactiva temporalmente el escáner BLE y la API para no saturar el sistema.
# 3. Permite flashear una versión corregida del firmware por Wi-Fi de forma segura.
# -----------------------------------------------------------------------------
safe_mode:

# -----------------------------------------------------------------------------
# Deep sleep.
# La placa queda dormida la mayor parte del tiempo para ahorrar energía.
# Cuando el PIR dispara o cuando caduca el tiempo activo, se vuelve a entrar en
# deep sleep. El GPIO14 se usa como wakeup source y también como pin de lectura
# del PIR por diseño del hardware.
# -----------------------------------------------------------------------------
deep_sleep:
  id: deep_sleep_1
  wakeup_pin:
    number: GPIO14
    mode: INPUT
  # keep_awake evita que el deep sleep se interrumpa por la lectura del pin del PIR
  # IGNORE permite que el deep sleep se interrumpa por el pin del PIR, pero no lo mantiene despierto
  wakeup_pin_mode: IGNORE # KEEP_AWAKE

# -----------------------------------------------------------------------------
# Sensor PIR.
# Es la entrada principal de activación del sistema. Cuando detecta movimiento,
# resetea el temporizador de inactividad y permite mantener la cámara despierta.
# El filtro delayed_off evita falsos negativos por cambios rápidos.
# -----------------------------------------------------------------------------
binary_sensor:
  - platform: template
    name: "PIR Motion"
    id: pir_motion
    device_class: motion
    # Usamos el pin del PIR definido en globals
    lambda: |-
      return (gpio_get_level((gpio_num_t)id(pir_gpio)) == 1);
    filters:
      # Evitamos que el sensor se apague inmediatamente tras detectar movimiento, para evitar falsos negativos
      - delayed_off: 2s

  # ---------------------------------------------------------------------------
  # Sensor de estado (despierto / dormido).
  # Expone un booleano en Home Assistant y en la API de ESPHome:
  #  - ON  cuando la cámara está activa (cliente conectado).
  #  - OFF justo antes de entrar en deep sleep.
  # Nota: al dormir, la API se desconecta y HA marca la entidad como
  # "unavailable"; el publish_state(false) previo sirve sobre todo al
  # cliente Python que mantiene la conexión ese instante.
  # ---------------------------------------------------------------------------
  - platform: template
    name: "Estado"
    id: estado
    device_class: running
    entity_category: diagnostic

# -----------------------------------------------------------------------------
# Parámetros configurables.
# Son los valores que se pueden ajustar desde Home Assistant sin recompilar el
# firmware. Esto hace que la cámara y el sistema sean totalmente parametrizables.
# -----------------------------------------------------------------------------
number:
  # Tiempo, en segundos, que el dispositivo permanece despierto tras una detección.
  # Cuanto mayor sea este valor, más tiempo estará activa la cámara antes de volver
  # a dormir.
  - platform: template
    name: "Tiempo despierto (s)"
    id: awake_duration
    min_value: 10
    max_value: 600
    step: 5
    unit_of_measurement: "s"
    optimistic: true
    restore_value: true
    initial_value: 60

  - platform: template
    name: "Cam XCLK (MHz)"
    id: cam_xclk_mhz
    min_value: 8
    max_value: 24
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 8
    set_action:
      - lambda: |-
          sensor_t *s = esp_camera_sensor_get();
          if (s != nullptr) {
            s->set_xclk(s, LEDC_TIMER_0, (int)x);
          }

  - platform: template
    name: "Cam JPEG Quality"
    id: cam_jpeg_quality
    min_value: 6
    max_value: 63
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 12
    set_action:
      - lambda: |-
          sensor_t *s = esp_camera_sensor_get();
          if (s != nullptr) {
            s->set_quality(s, (int)x);
          }

  - platform: template
    name: "Cam Max Framerate"
    id: cam_max_framerate
    min_value: 1
    max_value: 30
    step: 1
    unit_of_measurement: "fps"
    optimistic: true
    restore_value: true
    initial_value: 20
    set_action:
      - lambda: |-
          if (x > 0) {
            id(cam)->set_max_update_interval((uint32_t)(1000.0f / x));
          }

  - platform: template
    name: "Cam AE Level"
    id: cam_ae_level
    min_value: -2
    max_value: 2
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 0
    set_action:
      - lambda: |-
          id(cam)->set_ae_level((int) x);
          id(cam)->update_camera_parameters();

  - platform: template
    name: "Cam AGC Gain Ceiling"
    id: cam_gain_ceiling
    min_value: 0
    max_value: 6
    step: 1
    optimistic: true
    restore_value: true
    set_action:
      - lambda: |-
          id(cam)->set_agc_gain_ceiling(
            (esphome::esp32_camera::ESP32AgcGainCeiling)((int)x)
          );
          id(cam)->update_camera_parameters();

select:
  - platform: template
    name: "Cam Resolution"
    id: cam_resolution
    options:
      - "QVGA (320x240)"
      - "VGA (640x480)"
      - "SVGA (800x600)"
      - "HD (1280x720)"
      - "UXGA (1600x1200)"
    initial_option: "VGA (640x480)"
    optimistic: true
    restore_value: true
    set_action:
      - lambda: |-
          sensor_t *s = esp_camera_sensor_get();
          if (s != nullptr) {
            framesize_t frame = FRAMESIZE_VGA;
            if (x == "QVGA (320x240)") frame = FRAMESIZE_QVGA;
            else if (x == "VGA (640x480)") frame = FRAMESIZE_VGA;
            else if (x == "SVGA (800x600)") frame = FRAMESIZE_SVGA;
            else if (x == "HD (1280x720)") frame = FRAMESIZE_HD;
            else if (x == "UXGA (1600x1200)") frame = FRAMESIZE_UXGA;
            s->set_framesize(s, frame);
          }

# -----------------------------------------------------------------------------
# Texto configurable: URL de aviso al servidor.
# Es la URL a la que el ESP hace POST cuando se conecta a la Wi‑Fi para avisar
# al servidor Python de que está despierto. Se puede editar en runtime desde
# Home Assistant sin recompilar el firmware. El valor se guarda en flash
# (restore_value) y se recupera tras un reinicio o al despertar de deep sleep.
# -----------------------------------------------------------------------------
text:
  - platform: template
    name: "URL aviso servidor"
    id: server_awake_url
    entity_category: config
    mode: text
    optimistic: true
    restore_value: true
    min_length: 0
    max_length: 255
    initial_value: "http://192.168.1.171:8080/cameras/huerta/esphome/awake"

# -----------------------------------------------------------------------------
# Switch de cámara.
# Permite activar/desactivar funciones de procesamiento de imagen de forma
# parametrizable desde Home Assistant.
# -----------------------------------------------------------------------------
switch:
  - platform: template
    name: "Cam AEC2"
    id: cam_aec2
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: |-
          id(cam)->set_aec2(true);
          id(cam)->update_camera_parameters();
    turn_off_action:
      - lambda: |-
          id(cam)->set_aec2(false);
          id(cam)->update_camera_parameters();

# -----------------------------------------------------------------------------
# Botones de control y diagnóstico.
# - Restart: reinicia el microcontrolador.
# - Safe Mode: reinicia en modo seguro para recuperar un sistema inestable.
# - Ir a dormir: fuerza el deep sleep manualmente para ahorrar energía.
# -----------------------------------------------------------------------------
button:
  - platform: template
    name: "Ir a dormir"
    entity_category: config
    on_press:
      - lambda: |-
          id(estado).publish_state(false);
      - delay: 500ms
      - deep_sleep.enter: deep_sleep_1

  - platform: restart
    name: "Restart"
    entity_category: config

  - platform: safe_mode
    name: "Safe Mode"
    internal: false
    entity_category: config


# -----------------------------------------------------------------------------
# Sensores de diagnóstico.
# - Temperature: temperatura interna del ESP32.
# - Uptime: tiempo que lleva encendido el sistema.
# - WiFi Signal dB: nivel de señal Wi‑Fi para diagnosticar estabilidad de red.
# -----------------------------------------------------------------------------
sensor:
  - platform: internal_temperature
    name: "Temperature"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    id: uptime_sensor
    entity_category: diagnostic
    internal: true

  - platform: wifi_signal
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"

# -----------------------------------------------------------------------------
# Script de apagado automático.
# Cuando el sistema pasa demasiado tiempo sin movimiento, emite estado OFF y
# entra en deep sleep para ahorrar batería.
# -----------------------------------------------------------------------------
script:
  - id: script_dormir_auto
    then:
      - logger.log: "script_dormir_auto: sending estado OFF (reason: auto_timeout)"
      - lambda: |-
          id(estado).publish_state(false);
      # Esperamos 500 ms para que el evento llegue a HA antes de entrar en deep sleep
      - delay: 500ms
      - deep_sleep.enter: deep_sleep_1

# -----------------------------------------------------------------------------
# Interval de supervisión.
# Cada segundo comprueba si hay movimiento reciente. Si el PIR deja de detectar
# movimiento durante el tiempo configurado, se dispara el script de apagado.
# -----------------------------------------------------------------------------
interval:
  - interval: 1s
    then:
      - lambda: |-
          static uint32_t ultimo_movimiento = millis();
          // Usar el estado del binary_sensor (PIR) en lugar de acceder al pin 14
          if (id(pir_motion).state) {
            ultimo_movimiento = millis();
          }
          
          // Calculamos el tiempo límite leyendo tu número desde HA
          uint32_t tiempo_limite = (uint32_t)(id(awake_duration).state * 1000);
          
          // Si pasamos el límite de inactividad, mandamos a dormir
          if (millis() - ultimo_movimiento > tiempo_limite) {
            // Ponemos el contador altísimo para que no vuelva a entrar en 
            // este IF mientras el script retrasa el apagado medio segundo
            ultimo_movimiento = millis() + 9999999;
            id(script_dormir_auto).execute();
          }

# -----------------------------------------------------------------------------
# Componente personalizado basado en `esp32_camera` de ESPHome (opcional).
# Código original: https://github.com/esphome/esphome/tree/dev/esphome/components/esp32_camera
#
# Esta copia reproduce íntegramente el componente oficial, con una única
# modificación en `esp32_camera.cpp`:
#
#     this->config_.grab_mode = CAMERA_GRAB_LATEST;// Valor original: CAMERA_GRAB_WHEN_EMPTY
#
# Con este ajuste, la cámara entrega siempre el frame más reciente disponible,
# evitando que se acumulen imágenes antiguas en el buffer y reduciendo la
# latencia en transmisiones rápidas (streaming, detección, etc.).
#
# Estructura del componente local:
#  tu_proyecto/
#  ├── huerta.yaml
#  └── components/
#      └── esp32_camera/
#          ├── __init__.py
#          ├── esp32_camera.cpp
#          └── esp32_camera.h
# -----------------------------------------------------------------------------

external_components:
  - source:
      type: local
      path: components
    components: [esp32_camera]
