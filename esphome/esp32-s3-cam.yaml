# -----------------------------------------------------------------------------
# Sistema basado en ESP32-S3 con cámara para funcionamiento como fuente de vídeo
# permanente (proxy de cámara). La placa está siempre encendida y conectada a la
# Wi‑Fi, sirviendo stream y snapshot por HTTP para que un servicio de inferencia
# (Frigate, YOLO, etc.) los consuma de forma continua.
# -----------------------------------------------------------------------------

# INSTRUCCIONES RÁPIDAS
#
# 1) Configurar `secrets.yaml`
#    - Añade tus credenciales Wi‑Fi en `secrets.yaml` (keys: `wifi_ssid`, `wifi_password`).
#
# 2) Flashear y primera puesta en marcha
#    - Flashea con la CLI de ESPHome o con `esphome run esp32-s3-cam.yaml` por USB la primera vez.
#    - El logger tiene `baud_rate: 0`, así que no hay log por puerto serie: revisa el
#      arranque con `esphome logs esp32-s3-cam.yaml` (por red/API).
#      Busca líneas: "WiFi connected" y "IP Address: ..." para conocer la IP que asigna el DHCP.
#
# 3) Pruebas rápidas después del boot
#    - Comprobar snapshot: abrir `http://<IP>:8081` (snapshot) en un navegador.
#    - Comprobar stream: abrir `http://<IP>:8080/` con VLC o Frigate.
#
# 4) Integración con Python/servicio de inferencia
#    - Tu servicio puede leer el stream HTTP directamente (puerto 8080).
#    - Para controlar la cámara o leer diagnósticos desde Python, usa la API de ESPHome
#      (`aioesphomeapi`) y la clave `api.encryption.key` definida abajo.
#
# 5) Ajustes operativos desde Home Assistant
#    - `Cam Resolution`, `Cam JPEG Quality`, `Cam Max Framerate`, `Cam AE Level`,
#      `Cam AGC Gain Ceiling`, `Cam XCLK (MHz)`: parámetros ajustables en runtime sin recompilar.
#
# 6) Debug / Logs
#    - Para depurar, ejecuta `esphome logs esp32-s3-cam.yaml`.
#    - Busca: `api: client connected`, `WiFi connected`, `IP Address`.
#
# Resumen: usa el stream HTTP para inferencia rápida; usa la API solo para acciones
# y diagnóstico que deben ejecutar en el ESP.
# -----------------------------------------------------------------------------

esphome:
  name: esp32-s3-cam
  friendly_name: esp32-s3-cam
  # on_boot: se ejecuta después de que todos los componentes hayan hecho setup(), pero antes de que se inicie la API y el resto de servicios
  on_boot:
    priority: -100   # después de que la cámara, la API y el resto de componentes hayan hecho setup()
    then:
      # Aplicamos los ajustes de imagen y exposición
      - lambda: |-
          
          id(cam)->set_ae_level((int) id(cam_ae_level).state);
          id(cam)->set_aec2(id(cam_aec2).state);
          id(cam)->set_agc_gain_ceiling(
            (esphome::esp32_camera::ESP32AgcGainCeiling)((int)id(cam_gain_ceiling).state)
          );
          id(cam)->update_camera_parameters();

          // max_update_interval_ se mide en ms, no en fps -> hay que invertir el valor
          if (id(cam_max_framerate).state > 0) {
            id(cam)->set_max_update_interval(
              (uint32_t)(1000.0f / id(cam_max_framerate).state)
            );
          }
          
          sensor_t *s = esp_camera_sensor_get();
          if (s != nullptr) {
            s->set_quality(s, (int) id(cam_jpeg_quality).state);
            // El driver nativo espera el Timer y la frecuencia directamente en MHz
            // ESPHome usa LEDC_TIMER_0 internamente
            s->set_xclk(s, LEDC_TIMER_0, (int) id(cam_xclk_mhz).state);

            std::string res = id(cam_resolution).current_option().str();
            framesize_t frame = FRAMESIZE_VGA; // Por defecto

            if (res == "QVGA (320x240)") frame = FRAMESIZE_QVGA;
            else if (res == "VGA (640x480)") frame = FRAMESIZE_VGA;
            else if (res == "SVGA (800x600)") frame = FRAMESIZE_SVGA;
            else if (res == "HD (1280x720)") frame = FRAMESIZE_HD;
            else if (res == "UXGA (1600x1200)") frame = FRAMESIZE_UXGA;

            s->set_framesize(s, frame);
          }

          // Placa siempre encendida: dejamos el estado en ON por defecto.
          id(awake).publish_state(true);

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB  
  framework:
    type: esp-idf
    version: recommended

# -----------------------------------------------------------------------------
# Memoria PSRAM (RAM externa).
# - mode: octal -> bus de 8 líneas de datos en lugar de 4 (Quad): el doble de ancho de banda.
# - speed: 80MHz -> frecuencia de reloj del bus de memoria al máximo rendimiento soportado.
# -----------------------------------------------------------------------------
psram:
  mode: octal
  speed: 80MHz

# -----------------------------------------------------------------------------
# Logger.
# Para depurar, usa `esphome logs esp32-s3-cam.yaml`.
# baud_rate: 0 desactiva el log por puerto serie (UART) para liberar CPU y RAM.
# -----------------------------------------------------------------------------
logger:
  baud_rate: 0

# -----------------------------------------------------------------------------
# API de ESPHome.
# Canal de control con el cliente (servicio Python vía aioesphomeapi, o Home
# Assistant): expone las entidades de la cámara y los sensores de diagnóstico.
# Al conectar el cliente se publica el binary_sensor `awake`=ON. Esta placa
# está siempre encendida, así que `awake` se mantiene siempre en ON (nunca
# pasa a OFF); el servicio Python (main3) lo usa igual que en `huerta.yaml`
# para arrancar la lectura de la cámara.
# -----------------------------------------------------------------------------
api:
  encryption:
    key: "vta+gir53ODSa8kTZDDO/U3Qz8759pJQTmMI87r/Y2c="
  on_client_connected:
    then:
      # delay de 100ms para que la API esté lista antes de enviar el estado
      - delay: 100ms
      - logger.log: "api: client connected, sending awake ON"
      - lambda: |-
          id(awake).publish_state(true);

# -----------------------------------------------------------------------------
# Actualizaciones inalámbricas (OTA - Over-The-Air).
# Permite flashear el firmware del ESP32 por Wi-Fi, sin conectar el dispositivo
# por cable USB al ordenador.
# -----------------------------------------------------------------------------
ota:
  # Plataforma nativa de actualización inalámbrica de ESPHome
  - platform: esphome
    # Contraseña que autentica las peticiones de actualización desde Home Assistant o la CLI de ESPHome
    password: "0b933bfe0ac9aec79176365ccbc108dc"

# -----------------------------------------------------------------------------
# Cliente HTTP.
# Se usa para avisar por POST al servidor Python cuando el ESP se conecta a la
# Wi‑Fi, igual que en `huerta.yaml`. Así el servicio (main3) no tiene que
# esperar al siguiente reintento pasivo de la API para reconectar.
# -----------------------------------------------------------------------------
http_request:
  timeout: 2s

# -----------------------------------------------------------------------------
# Conectividad Wi‑Fi.
# - power_save_mode: none evita ahorrar energía en la radio para mejorar la respuesta.
# - output_power: 8.5 dBm; con el S3 hubo que bajarlo o el router rechazaba la conexión.
# - ap activa un AP local si la red principal no está disponible.
# - on_connect avisa por POST al servidor Python (URL en `server_awake_url`,
#   editable en runtime desde Home Assistant).
# -----------------------------------------------------------------------------
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  power_save_mode: none
  output_power: 8.5

  ap:
    ssid: "Fallback Hotspot"
    password: "teta1234"

  on_connect:
    - logger.log: "WiFi connected"
    # Solo avisa al servidor Python si `server_awake_url` no está en blanco.
    - if:
        condition:
          lambda: "return !id(server_awake_url).state.empty();"
        then:
          - http_request.post:
              # La URL se lee en runtime del text `server_awake_url`, editable desde Home Assistant.
              url: !lambda "return id(server_awake_url).state;"
              on_error:
                - logger.log: "No se pudo avisar al servidor Python (no pasa nada, seguirá reintentando solo)"
  on_disconnect:
    - logger.log: "WiFi disconnected"

# -----------------------------------------------------------------------------
# Cámara ESP32-S3.
# Aquí se define el hardware de la cámara y su configuración base.
# La resolución, el framerate, la calidad JPEG y la exposición se ajustan en
# runtime desde Home Assistant para poder parametrizar el sistema sin recompilar.
# -----------------------------------------------------------------------------
# Configuración de I2C para la cámara.
i2c:
  - id: i2c_bus
    sda: GPIO4
    scl: GPIO5

esp32_camera:
  name: "Cam"
  id: cam
  external_clock:
    pin: GPIO15
    frequency: 13MHz
  i2c_id: i2c_bus
  data_pins: [GPIO11, GPIO9, GPIO8, GPIO10, GPIO12, GPIO18, GPIO17, GPIO16]  # D0..D7
  vsync_pin: GPIO6
  href_pin: GPIO7
  pixel_clock_pin: GPIO13

  resolution: 1600X1200 # 800x600 320x240 640x480

  # frame_buffer_count: número de buffers de imagen que la cámara usa para almacenar frames antes de enviarlos.
  # Más buffers reducen pérdidas de frames y mejoran la fluidez en streaming, pero consumen más RAM/PSRAM.
  frame_buffer_count: 2

  idle_framerate: 0.1 fps
  vertical_flip: false
  horizontal_mirror: false

# -----------------------------------------------------------------------------
# Servidor web de la cámara.
# Permite acceder directamente al stream y a snapshot por HTTP sin depender de la
# API de ESPHome para la visualización de la imagen.
# -----------------------------------------------------------------------------
esp32_camera_web_server:
  - port: 8080
    mode: stream
  - port: 8081
    mode: snapshot

captive_portal:

# -----------------------------------------------------------------------------
# Modo seguro de recuperación (safe mode).
# Detecta fallos de arranque o reinicios en bucle (bootloops). En este modo:
# 1. Mantiene activa la conectividad Wi-Fi y la interfaz OTA.
# 2. Desactiva temporalmente el escáner BLE y la API para no saturar el sistema.
# 3. Permite flashear una versión corregida del firmware por Wi-Fi de forma segura.
# -----------------------------------------------------------------------------
safe_mode:

# -----------------------------------------------------------------------------
# Sensor de estado (despierto / dormido).
# Igual que en `huerta.yaml`, pero esta placa está siempre encendida: el valor
# se fija en ON en el arranque y al conectar el cliente, y nunca pasa a OFF.
# El servicio Python (main3) vigila este binary_sensor por su object_id
# `awake` para arrancar la lectura de la cámara.
# -----------------------------------------------------------------------------
binary_sensor:
  - platform: template
    name: "Awake"
    id: awake
    device_class: running
    entity_category: diagnostic

# -----------------------------------------------------------------------------
# Entidades de control de la cámara.
# Valores ajustables desde Home Assistant sin recompilar el firmware: exposición
# (AEC2, AE Level, AGC Gain Ceiling), XCLK, calidad JPEG, framerate y resolución.
# -----------------------------------------------------------------------------
switch:
  # Activa/desactiva la función de exposición automática avanzada (AEC2) de la cámara.
  - platform: template
    name: "Cam AEC2"
    id: cam_aec2
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: |-
          id(cam)->set_aec2(true);
          id(cam)->update_camera_parameters();
    turn_off_action:
      - lambda: |-
          id(cam)->set_aec2(false);
          id(cam)->update_camera_parameters();

number:
  - platform: template
    name: "Cam XCLK (MHz)"
    id: cam_xclk_mhz
    min_value: 8
    max_value: 24   # 20MHz es lo habitual máximo estable, 24MHz es overclock
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 8   # Pon el valor que tienes por defecto en tu config
    set_action:
      - lambda: |-
          sensor_t *s = esp_camera_sensor_get();
          if (s != nullptr) {
            // El driver nativo espera el Timer y la frecuencia directamente en MHz
            // ESPHome usa LEDC_TIMER_0 internamente
            s->set_xclk(s, LEDC_TIMER_0, (int)x);
          }
  - platform: template
    name: "Cam JPEG Quality"
    id: cam_jpeg_quality
    min_value: 6
    max_value: 63
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 12
    set_action:
      - lambda: |-
          sensor_t *s = esp_camera_sensor_get();
          if (s != nullptr) {
            // Llama directamente al driver del sensor. Números bajos = mejor calidad
            s->set_quality(s, (int)x); 
          }
  # Framerate máximo de la cámara mientras hay un consumidor de stream activo (Frigate/YOLO).
  # ESPHome lo aplica internamente como un intervalo en ms (1000/fps), no como fps directamente.
  - platform: template
    name: "Cam Max Framerate"
    id: cam_max_framerate
    min_value: 1
    max_value: 30   # por encima de ~20-25fps riesgo de sobrecalentamiento/artefactos, según doc de ESPHome
    step: 1
    unit_of_measurement: "fps"
    optimistic: true
    restore_value: true
    initial_value: 20
    set_action:
      - lambda: |-
          if (x > 0) {
            id(cam)->set_max_update_interval((uint32_t)(1000.0f / x));
          }

  # Ajusta el nivel de exposición automática (AE Level) de la cámara. Valores típicos: -2 a +2.
  - platform: template
    name: "Cam AE Level"
    id: cam_ae_level
    min_value: -2
    max_value: 2
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 0
    set_action:
      - lambda: |-
          id(cam)->set_ae_level((int) x);
          id(cam)->update_camera_parameters();

  # Ajusta el nivel máximo de ganancia automática (AGC Gain Ceiling) de la cámara. Valores típicos: 0 a 6.
  - platform: template
    name: "Cam AGC Gain Ceiling"
    id: cam_gain_ceiling
    min_value: 0
    max_value: 6    # 0=2x, 1=4x, 2=8x, 3=16x, 4=32x, 5=64x, 6=128x
    step: 1
    optimistic: true
    restore_value: true
    set_action:
      - lambda: |-
          id(cam)->set_agc_gain_ceiling(
            (esphome::esp32_camera::ESP32AgcGainCeiling)((int)x)
          );
          id(cam)->update_camera_parameters();
select:
  - platform: template
    name: "Cam Resolution"
    id: cam_resolution
    options:
      - "QVGA (320x240)"
      - "VGA (640x480)"
      - "SVGA (800x600)"
      - "HD (1280x720)"
      - "UXGA (1600x1200)"
    initial_option: "VGA (640x480)"
    optimistic: true
    restore_value: true
    set_action:
      - lambda: |-
          sensor_t *s = esp_camera_sensor_get();
          if (s != nullptr) {
            framesize_t frame = FRAMESIZE_VGA;
            if (x == "QVGA (320x240)") frame = FRAMESIZE_QVGA;
            else if (x == "VGA (640x480)") frame = FRAMESIZE_VGA;
            else if (x == "SVGA (800x600)") frame = FRAMESIZE_SVGA;
            else if (x == "HD (1280x720)") frame = FRAMESIZE_HD;
            else if (x == "UXGA (1600x1200)") frame = FRAMESIZE_UXGA;
            
            // Aplica la resolución directamente al hardware
            s->set_framesize(s, frame);
          }

# -----------------------------------------------------------------------------
# Texto configurable: URL de aviso al servidor.
# URL a la que el ESP hace POST cuando se conecta a la Wi‑Fi (wifi.on_connect)
# para avisar al servidor Python de que está disponible. Editable en runtime
# desde Home Assistant sin recompilar; el valor se guarda en flash
# (restore_value). Igual que en `huerta.yaml`, cambiando solo el camera_id.
# -----------------------------------------------------------------------------
text:
  - platform: template
    name: "Server awake URL"
    id: server_awake_url
    entity_category: config
    mode: text
    optimistic: true
    restore_value: true
    min_length: 0
    max_length: 255
    initial_value: "http://192.168.1.171:8080/cameras/esp32-s3-cam/esphome/awake"

# -----------------------------------------------------------------------------
# Botones de control y diagnóstico.
# - Restart: reinicia el microcontrolador.
# - Safe Mode: reinicia en modo seguro para recuperar un sistema inestable.
# -----------------------------------------------------------------------------
button:
  # Botón para reiniciar el microcontrolador de forma remota
  # Útil si la pila Bluetooth se congela o si necesitas forzar una reconexión limpia con la API
  - platform: restart
    name: "Restart"
    entity_category: config

  # Botón para orquestar un reinicio manual directamente en Modo Seguro (Safe Mode)
  # Detiene el escaneo BLE y la API para permitir actualizaciones OTA estables si el sistema está inestable
  - platform: safe_mode
    name: "Safe Mode"
    internal: false
    entity_category: config

# -----------------------------------------------------------------------------
# Sensores de diagnóstico.
# - Temperature: temperatura interna del ESP32.
# - Uptime: tiempo que lleva encendido el sistema.
# - WiFi Signal dB: nivel de señal Wi‑Fi para diagnosticar estabilidad de red.
# -----------------------------------------------------------------------------
sensor:
  # Sensor de Temperatura Interna
  - platform: internal_temperature
    name: "Temperature"
    update_interval: 60s
    entity_category: diagnostic

  # Mide el tiempo ininterrumpido (en segundos) que lleva encendido el ESP32
  # Marca 'internal: true' para no saturar la base de datos de Home Assistant con un sensor que cambia cada segundo
  - platform: uptime
    name: "Uptime"
    id: uptime_sensor
    entity_category: diagnostic
    internal: true

  # Mide la intensidad del enlace Wi-Fi con el router en dBm cada 60 segundos
  - platform: wifi_signal
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"

# -----------------------------------------------------------------------------
# Componente personalizado basado en `esp32_camera` de ESPHome (opcional).
# Código original: https://github.com/esphome/esphome/tree/dev/esphome/components/esp32_camera
#
# Esta copia reproduce íntegramente el componente oficial, con una única
# modificación en `esp32_camera.cpp`:
#
#     this->config_.grab_mode = CAMERA_GRAB_LATEST;// Valor original: CAMERA_GRAB_WHEN_EMPTY
#
# Con este ajuste, la cámara entrega siempre el frame más reciente disponible,
# evitando que se acumulen imágenes antiguas en el buffer y reduciendo la
# latencia en transmisiones rápidas (streaming, detección, etc.).
#
# Estructura del componente local:
#  tu_proyecto/
#  ├── esp32-s3-cam.yaml
#  └── components/
#      └── esp32_camera/
#          ├── __init__.py
#          ├── esp32_camera.cpp
#          └── esp32_camera.h
# -----------------------------------------------------------------------------
external_components:
  - source:
      type: local
      path: components
    components: [esp32_camera]