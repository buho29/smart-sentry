# -----------------------------------------------------------------------------
# Variante "torreta": ESP32-S3 con cámara + dos servos (pan/tilt), sin PIR y sin
# deep sleep. La placa está siempre encendida sirviendo stream por HTTP, y el
# servicio Python de inferencia mueve los servos por la API nativa para centrar
# el objetivo que está siguiendo.
#
# Es hermana de `esp32-s3-cam.yaml` (misma cámara, mismo servidor web, mismos
# ajustes de imagen); lo único propio de esta variante son los bloques
# `output:`, `servo:` y la acción `set_servo_position` del bloque `api:`.
# -----------------------------------------------------------------------------

# INSTRUCCIONES RÁPIDAS
#
# 1) Antes de flashear
#    - Credenciales Wi-Fi en `secrets.yaml` (`wifi_ssid`, `wifi_password`).
#    - **Elegir los GPIO de los servos** (marcados como PENDIENTE abajo): tienen
#      que ser pines libres, que no choquen con los de la cámara ni con los
#      strapping pins del S3. Los de la cámara ocupados aquí son:
#      4, 5 (I2C), 15 (XCLK), 6, 7, 13 (sync/pclk) y 8..12, 16..18 (datos).
#    - **Generar claves propias**: `api.encryption.key` y la contraseña de OTA
#      NO deben copiarse de otra placa. Genera una clave nueva con
#      `openssl rand -base64 32` y ponla también en el `noise_psk` de la cámara
#      en `detect/cameras_config.json`.
#    - Ajustar `server_awake_url` y el `camera_id` que lleva dentro.
#
# 2) Comprobar sin hardware: `esphome config esp32-s3-cam-servo.yaml`
#    valida la sintaxis y la asignación de canales LEDC.
#
# 3) Probar los servos desde el servicio Python (con `esphome logs ...` abierto):
#      POST http://<servidor>:8080/cameras/<camera_id>/servo   {"pan": 0, "tilt": 0}
#    Debe aparecer la ejecución de `set_servo_position` en el log del ESP.
#    `GET /cameras/<camera_id>/status` dice en `consumers` si la placa está
#    publicando el servicio.
# -----------------------------------------------------------------------------

esphome:
  name: esp32-s3-cam-servo
  friendly_name: esp32-s3-cam-servo
  # on_boot: después de que la cámara, la API y el resto hayan hecho setup()
  on_boot:
    priority: -100
    then:
      # Servos a reposo antes que nada: al arrancar, un servo sin señal se queda
      # donde lo dejó el apagón, y conviene partir de una posición conocida.
      - servo.write:
          id: servo_pan
          level: 0%
      - servo.write:
          id: servo_tilt
          level: 0%
      # Ajustes de imagen y exposición (idénticos a esp32-s3-cam.yaml)
      - lambda: |-

          id(cam)->set_ae_level((int) id(cam_ae_level).state);
          id(cam)->set_aec2(id(cam_aec2).state);
          id(cam)->set_agc_gain_ceiling(
            (esphome::esp32_camera::ESP32AgcGainCeiling)((int)id(cam_gain_ceiling).state)
          );
          id(cam)->update_camera_parameters();

          // max_update_interval_ se mide en ms, no en fps -> hay que invertir el valor
          if (id(cam_max_framerate).state > 0) {
            id(cam)->set_max_update_interval(
              (uint32_t)(1000.0f / id(cam_max_framerate).state)
            );
          }

          sensor_t *s = esp_camera_sensor_get();
          if (s != nullptr) {
            s->set_quality(s, (int) id(cam_jpeg_quality).state);
            // El driver nativo espera el Timer y la frecuencia directamente en MHz
            // ESPHome usa LEDC_TIMER_0 internamente
            s->set_xclk(s, LEDC_TIMER_0, (int) id(cam_xclk_mhz).state);

            std::string res = id(cam_resolution).current_option().str();
            framesize_t frame = FRAMESIZE_VGA; // Por defecto

            if (res == "QVGA (320x240)") frame = FRAMESIZE_QVGA;
            else if (res == "VGA (640x480)") frame = FRAMESIZE_VGA;
            else if (res == "SVGA (800x600)") frame = FRAMESIZE_SVGA;
            else if (res == "HD (1280x720)") frame = FRAMESIZE_HD;
            else if (res == "UXGA (1600x1200)") frame = FRAMESIZE_UXGA;

            s->set_framesize(s, frame);
          }

          // Placa siempre encendida: dejamos el estado en ON por defecto.
          id(awake).publish_state(true);

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    version: recommended

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG
  logs:
    esp32_camera_web_server: WARN
#  baud_rate: 0

# -----------------------------------------------------------------------------
# Servos pan/tilt.
#
# OJO CON EL TIMER LEDC: la cámara usa LEDC_TIMER_0 para el XCLK, a decenas de
# MHz (ver el `set_xclk` de arriba). Los servos necesitan 50 Hz, y en el ESP32
# cada PAR de canales LEDC comparte timer (0-1 -> timer 0, 2-3 -> timer 1,
# 4-5 -> timer 2, 6-7 -> timer 3). Por eso van en los canales 4 y 6: usar el 0
# o el 1 reprogramaría el timer del XCLK y rompería la imagen de la cámara.
#
# auto_detach_time corta el PWM cuando el servo lleva un rato quieto: menos
# zumbido, menos consumo y menos calentamiento del servo manteniendo posición.
# transition_length: 0s porque el suavizado del movimiento lo hace el control
# proporcional del lado Python (detect/servo_tracker.py); interpolar también
# aquí solo añadiría retraso al lazo de seguimiento.
# -----------------------------------------------------------------------------
output:
  - platform: ledc
    id: pwm_pan
    pin: GPIO21   # PENDIENTE: confirmar al montar el hardware
    frequency: 50Hz
    channel: 4
  - platform: ledc
    id: pwm_tilt
    pin: GPIO47   # PENDIENTE: confirmar al montar el hardware
    frequency: 50Hz
    channel: 6

servo:
  - id: servo_pan
    output: pwm_pan
    auto_detach_time: 2s
    transition_length: 0s
  - id: servo_tilt
    output: pwm_tilt
    auto_detach_time: 2s
    transition_length: 0s

# -----------------------------------------------------------------------------
# API de ESPHome.
# Canal de control con el servicio Python (aioesphomeapi) y con Home Assistant.
# Al conectar el cliente se publica `awake`=ON; esta placa está siempre
# encendida, así que nunca pasa a OFF.
#
# `set_servo_position` es el contrato con el lado Python: el nombre se busca
# LITERAL en detect/main.py (`s.name == "set_servo_position"`), así que
# renombrarlo aquí deja el seguimiento mudo sin dar ningún error. `pan` y `tilt`
# van en el rango -1.0 .. 1.0, que es lo que espera `servo.write`.
# -----------------------------------------------------------------------------
api:
  encryption:
    # Clave propia de esta placa, generada al crear el fichero. Si prefieres una
    # tuya: `openssl rand -base64 32`. Sea cual sea, tiene que coincidir con el
    # `noise_psk` de esta cámara en detect/cameras_config.json.
    key: "KEcsQUr/bjV+LS6s39eI62jJeJ5o5hyBKLXDiBEvUOU="
  on_client_connected:
    then:
      # delay de 100ms para que la API esté lista antes de enviar el estado
      - delay: 100ms
      - logger.log: "api: client connected, sending awake ON"
      - lambda: |-
          id(awake).publish_state(true);
  actions:
    - action: set_servo_position
      variables:
        pan: float
        tilt: float
      then:
        - servo.write:
            id: servo_pan
            level: !lambda "return pan;"
        - servo.write:
            id: servo_tilt
            level: !lambda "return tilt;"

ota:
  - platform: esphome
    # Propia de esta placa, no copiada de otra.
    password: "e75a72bc03519a4b9a8e0bfbe6dbf83f"

http_request:
  timeout: 2s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  power_save_mode: none
  output_power: 8.5

  ap:
    ssid: "Fallback Hotspot"
    password: "teta1234"

  on_connect:
    - logger.log: "WiFi connected"
    # Solo avisa al servidor Python si `server_awake_url` no está en blanco.
    - if:
        condition:
          lambda: "return !id(server_awake_url).state.empty();"
        then:
          - http_request.post:
              url: !lambda "return id(server_awake_url).state;"
              on_error:
                - logger.log: "No se pudo avisar al servidor Python (no pasa nada, seguirá reintentando solo)"
  on_disconnect:
    - logger.log: "WiFi disconnected"

# -----------------------------------------------------------------------------
# Cámara ESP32-S3 (mismo hardware y pinout que esp32-s3-cam.yaml).
# -----------------------------------------------------------------------------
i2c:
  - id: i2c_bus
    sda: GPIO4
    scl: GPIO5

esp32_camera:
  name: "Cam"
  id: cam
  external_clock:
    pin: GPIO15
    frequency: 13MHz
  i2c_id: i2c_bus
  data_pins: [GPIO11, GPIO9, GPIO8, GPIO10, GPIO12, GPIO18, GPIO17, GPIO16]  # D0..D7
  vsync_pin: GPIO6
  href_pin: GPIO7
  pixel_clock_pin: GPIO13

  resolution: 1600X1200 # 800x600 320x240 640x480

  frame_buffer_count: 2

  idle_framerate: 0.1 fps
  vertical_flip: false
  horizontal_mirror: false

esp32_camera_web_server:
  - port: 8080
    mode: stream
  - port: 8081
    mode: snapshot

captive_portal:

safe_mode:

binary_sensor:
  - platform: template
    name: "Awake"
    id: awake
    device_class: running
    entity_category: diagnostic

# -----------------------------------------------------------------------------
# Entidades de control de la cámara (ajustables en runtime sin recompilar).
# -----------------------------------------------------------------------------
switch:
  - platform: template
    name: "Cam AEC2"
    id: cam_aec2
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: |-
          id(cam)->set_aec2(true);
          id(cam)->update_camera_parameters();
    turn_off_action:
      - lambda: |-
          id(cam)->set_aec2(false);
          id(cam)->update_camera_parameters();

number:
  - platform: template
    name: "Cam XCLK (MHz)"
    id: cam_xclk_mhz
    min_value: 8
    max_value: 24   # 20MHz es lo habitual máximo estable, 24MHz es overclock
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 8
    set_action:
      - lambda: |-
          sensor_t *s = esp_camera_sensor_get();
          if (s != nullptr) {
            s->set_xclk(s, LEDC_TIMER_0, (int)x);
          }
  - platform: template
    name: "Cam JPEG Quality"
    id: cam_jpeg_quality
    min_value: 6
    max_value: 63
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 12
    set_action:
      - lambda: |-
          sensor_t *s = esp_camera_sensor_get();
          if (s != nullptr) {
            // Llama directamente al driver del sensor. Números bajos = mejor calidad
            s->set_quality(s, (int)x);
          }
  - platform: template
    name: "Cam Max Framerate"
    id: cam_max_framerate
    min_value: 1
    max_value: 30
    step: 1
    unit_of_measurement: "fps"
    optimistic: true
    restore_value: true
    initial_value: 20
    set_action:
      - lambda: |-
          if (x > 0) {
            id(cam)->set_max_update_interval((uint32_t)(1000.0f / x));
          }

  - platform: template
    name: "Cam AE Level"
    id: cam_ae_level
    min_value: -2
    max_value: 2
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 0
    set_action:
      - lambda: |-
          id(cam)->set_ae_level((int) x);
          id(cam)->update_camera_parameters();

  - platform: template
    name: "Cam AGC Gain Ceiling"
    id: cam_gain_ceiling
    min_value: 0
    max_value: 6    # 0=2x, 1=4x, 2=8x, 3=16x, 4=32x, 5=64x, 6=128x
    step: 1
    optimistic: true
    restore_value: true
    set_action:
      - lambda: |-
          id(cam)->set_agc_gain_ceiling(
            (esphome::esp32_camera::ESP32AgcGainCeiling)((int)x)
          );
          id(cam)->update_camera_parameters();

  - platform: template
    name: "Servo Pan"
    id: servo_pan_number
    min_value: -1.0
    max_value: 1.0
    step: 0.01
    optimistic: true
    restore_value: false
    initial_value: 0
    set_action:
      - servo.write:
          id: servo_pan
          level: !lambda "return x;"
  - platform: template
    name: "Servo Tilt"
    id: servo_tilt_number
    min_value: -1.0
    max_value: 1.0
    step: 0.01
    optimistic: true
    restore_value: false
    initial_value: 0
    set_action:
      - servo.write:
          id: servo_tilt
          level: !lambda "return x;"

select:
  - platform: template
    name: "Cam Resolution"
    id: cam_resolution
    options:
      - "QVGA (320x240)"
      - "VGA (640x480)"
      - "SVGA (800x600)"
      - "HD (1280x720)"
      - "UXGA (1600x1200)"
    initial_option: "VGA (640x480)"
    optimistic: true
    restore_value: true
    set_action:
      - lambda: |-
          sensor_t *s = esp_camera_sensor_get();
          if (s != nullptr) {
            framesize_t frame = FRAMESIZE_VGA;
            if (x == "QVGA (320x240)") frame = FRAMESIZE_QVGA;
            else if (x == "VGA (640x480)") frame = FRAMESIZE_VGA;
            else if (x == "SVGA (800x600)") frame = FRAMESIZE_SVGA;
            else if (x == "HD (1280x720)") frame = FRAMESIZE_HD;
            else if (x == "UXGA (1600x1200)") frame = FRAMESIZE_UXGA;

            // Aplica la resolución directamente al hardware
            s->set_framesize(s, frame);
          }

text:
  - platform: template
    name: "Server awake URL"
    id: server_awake_url
    entity_category: config
    mode: text
    optimistic: true
    restore_value: true
    min_length: 0
    max_length: 255
    initial_value: "http://192.168.1.171:8080/cameras/esp32-s3-cam-servo/esphome/awake"

# -----------------------------------------------------------------------------
# Botones de control y diagnóstico.
# Los dos de centrado sirven para comprobar el recorrido mecánico de la torreta
# sin necesidad de tener el servicio Python levantado.
# -----------------------------------------------------------------------------
button:
  - platform: restart
    name: "Restart"
    entity_category: config

  - platform: safe_mode
    name: "Safe Mode"
    internal: false
    entity_category: config

  - platform: template
    name: "Servos home"
    entity_category: config
    on_press:
      - servo.write:
          id: servo_pan
          level: 0%
      - servo.write:
          id: servo_tilt
          level: 0%
      # servo.write no actualiza los number template (son entidades aparte);
      # sin esto el slider se queda mostrando el último valor movido a mano
      # aunque el servo físico ya esté en 0.
      - number.set_value:
          id: servo_pan_number
          value: 0
      - number.set_value:
          id: servo_tilt_number
          value: 0

sensor:
  - platform: internal_temperature
    name: "Temperature"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    id: uptime_sensor
    entity_category: diagnostic
    internal: true

  - platform: wifi_signal
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"

# -----------------------------------------------------------------------------
# Componente `esp32_camera` local con `grab_mode = CAMERA_GRAB_LATEST`, para que
# la cámara entregue siempre el frame más reciente en vez de acumular antiguos.
# Ver la nota larga en esp32-s3-cam.yaml.
# -----------------------------------------------------------------------------
external_components:
  - source:
      type: local
      path: components
    components: [esp32_camera]
