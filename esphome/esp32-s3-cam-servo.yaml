# -----------------------------------------------------------------------------
# Variante "torreta": ESP32-S3 con cámara + dos servos (pan/tilt), sin PIR y sin
# deep sleep. La placa está siempre encendida sirviendo stream por HTTP, y el
# servicio Python de inferencia mueve los servos por la API nativa para centrar
# el objetivo que está siguiendo.
#
# Es hermana de `esp32-s3-cam.yaml` (misma cámara, mismo servidor web, mismos
# ajustes de imagen); lo único propio de esta variante son los bloques
# `output:`, `servo:` y la acción `set_servo_position` del bloque `api:`.
# -----------------------------------------------------------------------------

# INSTRUCCIONES RÁPIDAS
#
# 1) Antes de flashear
#    - Credenciales Wi-Fi en `secrets.yaml` (`wifi_ssid`, `wifi_password`).
#    - **Elegir los GPIO de los servos** (marcados como PENDIENTE abajo): tienen
#      que ser pines libres, que no choquen con los de la cámara ni con los
#      strapping pins del S3. Los de la cámara ocupados aquí son:
#      4, 5 (I2C), 15 (XCLK), 6, 7, 13 (sync/pclk) y 8..12, 16..18 (datos).
#    - **Generar claves propias**: `api.encryption.key` y la contraseña de OTA
#      NO deben copiarse de otra placa. Genera una clave nueva con
#      `openssl rand -base64 32` y ponla también en el `noise_psk` de la cámara
#      en `detect/cameras_config.json`.
#    - Ajustar `server_awake_url` y el `camera_id` que lleva dentro.
#
# 2) Comprobar sin hardware: `esphome config esp32-s3-cam-servo.yaml`
#    valida la sintaxis y la asignación de canales LEDC.
#
# 3) Probar los servos desde el servicio Python (con `esphome logs ...` abierto):
#      POST http://<servidor>:8080/cameras/<camera_id>/servo   {"pan": 0, "tilt": 0}
#    Debe aparecer la ejecución de `set_servo_position` en el log del ESP.
#    `GET /cameras/<camera_id>/status` dice en `consumers` si la placa está
#    publicando el servicio.
# -----------------------------------------------------------------------------

esphome:
  name: esp32-s3-cam-servo
  friendly_name: esp32-s3-cam-servo
  # on_boot: después de que la cámara, la API y el resto hayan hecho setup()
  on_boot:
    priority: -100
    then:
      # Auto-detach restaurado del number "Servo auto detach": restore_value
      # recupera el valor pero no ejecuta su set_action al arrancar. La
      # velocidad y el suavizado no hace falta: el interval de los servos lee
      # sus number en cada pasada.
      - lambda: |-
          uint32_t ad = (uint32_t) (id(servo_auto_detach).state * 1000.0f);
          id(servo_pan).set_auto_detach_time(ad);
          id(servo_tilt).set_auto_detach_time(ad);
      # Servos a reposo antes que nada: al arrancar, un servo sin señal se queda
      # donde lo dejó el apagón, y conviene partir de una posición conocida.
      # Va directo y no por el interval: no se sabe dónde está, así que no hay
      # desde dónde suavizar. Las globals ya arrancan a 0.
      - servo.write:
          id: servo_pan
          level: 0%
      - servo.write:
          id: servo_tilt
          level: 0%
      # Ajustes de imagen y exposición (idénticos a esp32-s3-cam.yaml)
      - lambda: |-

          id(cam)->set_ae_level((int) id(cam_ae_level).state);
          id(cam)->set_aec2(id(cam_aec2).state);
          id(cam)->set_agc_gain_ceiling(
            (esphome::esp32_camera::ESP32AgcGainCeiling)((int)id(cam_gain_ceiling).state)
          );
          id(cam)->update_camera_parameters();

          // max_update_interval_ se mide en ms, no en fps -> hay que invertir el valor
          if (id(cam_max_framerate).state > 0) {
            id(cam)->set_max_update_interval(
              (uint32_t)(1000.0f / id(cam_max_framerate).state)
            );
          }

          sensor_t *s = esp_camera_sensor_get();
          if (s != nullptr) {
            s->set_quality(s, (int) id(cam_jpeg_quality).state);
            // El driver nativo espera el Timer y la frecuencia directamente en MHz
            // ESPHome usa LEDC_TIMER_0 internamente
            s->set_xclk(s, LEDC_TIMER_0, (int) id(cam_xclk_mhz).state);

            std::string res = id(cam_resolution).current_option().str();
            framesize_t frame = FRAMESIZE_VGA; // Por defecto

            if (res == "QVGA (320x240)") frame = FRAMESIZE_QVGA;
            else if (res == "VGA (640x480)") frame = FRAMESIZE_VGA;
            else if (res == "SVGA (800x600)") frame = FRAMESIZE_SVGA;
            else if (res == "HD (1280x720)") frame = FRAMESIZE_HD;
            else if (res == "UXGA (1600x1200)") frame = FRAMESIZE_UXGA;

            s->set_framesize(s, frame);
          }

          // Placa siempre encendida: dejamos el estado en ON por defecto.
          id(awake).publish_state(true);

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    version: recommended

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG
  logs:
    esp32_camera_web_server: WARN
#  baud_rate: 0

# -----------------------------------------------------------------------------
# Servos pan/tilt.
#
# OJO CON EL TIMER LEDC: la cámara usa LEDC_TIMER_0 para el XCLK, a decenas de
# MHz (ver el `set_xclk` de arriba). Los servos necesitan 50 Hz, y en el ESP32
# cada PAR de canales LEDC comparte timer (0-1 -> timer 0, 2-3 -> timer 1,
# 4-5 -> timer 2, 6-7 -> timer 3). Por eso van en los canales 4 y 6: usar el 0
# o el 1 reprogramaría el timer del XCLK y rompería la imagen de la cámara.
#
# auto_detach_time corta el PWM cuando el servo lleva un rato quieto: menos
# zumbido, menos consumo y menos calentamiento del servo manteniendo posición.
# Mientras el seguimiento está activo lo anula con `set_servo_hold` (ver api):
# suelto, el servo hace caso a los picos espurios de la señal.
#
# MOVIMIENTO: transition_length va a 0 y la animación la hace el interval de
# más abajo. La transición de ESPHome va a velocidad constante: arranca y para
# de golpe, y cada orden del seguimiento se notaba como un paso seco. Ahora,
# por eje, cada ~20 ms:
#
#   mid += clamp(target - mid, ±vmax*dt)   limitador, vmax = 2 / "Servo transition"
#   pos += (mid - pos) * k                 x += (xfinal - x) / vel, la de Flash
#   k = 1 - exp(-dt / "Servo smoothing")   no depende del ritmo del interval
#
# `target` es lo que se pide (API, number, HA). `mid` va hacia él a velocidad
# máxima constante, como la transición de antes, y `pos` lo sigue frenando
# suave: la velocidad del servo nunca salta, ni al arrancar ni al frenar, y si
# llega una orden a mitad de camino sigue desde donde va. Con "Servo
# smoothing" a 0 queda exactamente la transición lineal de antes.
#
# Ojo: el suavizado retrasa la torreta unos `tau` segundos. Si se acerca al
# min_interval_sec del seguimiento (0.2 s), el lazo oscila: mantenerlo bajo.
#
# Los valores de aquí son solo los de arranque: los pisa en on_boot el number
# "Servo auto detach" (más abajo). Velocidad, suavizado y auto-detach se
# cambian en caliente desde HA o desde el servicio (POST /config/servo) sin
# compilar.
# -----------------------------------------------------------------------------
output:
  - platform: ledc
    id: pwm_pan
    pin: GPIO21  
    frequency: 50Hz
    channel: 4
  - platform: ledc
    id: pwm_tilt
    pin: GPIO47
    frequency: 50Hz
    channel: 6

servo:
  - id: servo_pan
    output: pwm_pan
    auto_detach_time: 2s
    transition_length: 0s
  - id: servo_tilt
    output: pwm_tilt
    auto_detach_time: 2s
    transition_length: 0s

# Estado de la animación por eje (ver MOVIMIENTO arriba). `*_moving` dice si
# queda camino: con false el interval no escribe, y así el auto-detach puede
# cortar el PWM.
globals:
  - id: pan_target
    type: float
    initial_value: "0"
  - id: pan_mid
    type: float
    initial_value: "0"
  - id: pan_pos
    type: float
    initial_value: "0"
  - id: pan_moving
    type: bool
    initial_value: "false"
  - id: tilt_target
    type: float
    initial_value: "0"
  - id: tilt_mid
    type: float
    initial_value: "0"
  - id: tilt_pos
    type: float
    initial_value: "0"
  - id: tilt_moving
    type: bool
    initial_value: "false"
  - id: servo_last_ms
    type: uint32_t
    initial_value: "0"
  # Hold del seguimiento (ver acción `set_servo_hold`): mientras está activo el
  # auto-detach queda a 0. Caduca solo en `servo_hold_until` si nadie lo
  # refresca, para que una caída del servicio Python no deje los servos
  # sujetando para siempre.
  - id: servo_hold
    type: bool
    initial_value: "false"
  - id: servo_hold_until
    type: uint32_t
    initial_value: "0"

interval:
  - interval: 20ms
    then:
      - lambda: |-
          uint32_t now = millis();
          // dt real: con la cámara cargada el interval no es exacto. Tope de
          // 0.1 s para que un parón largo no dé un salto.
          float dt = std::min((now - id(servo_last_ms)) / 1000.0f, 0.1f);
          id(servo_last_ms) = now;
          // Hold caducado: vuelve el auto-detach del number.
          if (id(servo_hold) && (int32_t) (now - id(servo_hold_until)) > 0) {
            id(servo_hold) = false;
            uint32_t ad = (uint32_t) (id(servo_auto_detach).state * 1000.0f);
            id(servo_pan).set_auto_detach_time(ad);
            id(servo_tilt).set_auto_detach_time(ad);
          }
          if (!id(pan_moving) && !id(tilt_moving)) return;

          float transition = id(servo_transition).state;
          float tau = id(servo_smoothing).state;
          float max_step = (transition > 0) ? 2.0f / transition * dt : 2.0f;
          float k = (tau > 0) ? 1.0f - expf(-dt / tau) : 1.0f;

          auto step = [&](servo::Servo *s, float target, float &mid, float &pos, bool &moving) {
            if (!moving) return;
            mid += std::max(-max_step, std::min(max_step, target - mid));
            pos += (mid - pos) * k;
            if (fabsf(target - pos) < 0.002f) {
              // Llegó: el valor exacto una vez y se deja de escribir.
              mid = pos = target;
              moving = false;
            }
            s->write(pos);
          };
          step(id(servo_pan), id(pan_target), id(pan_mid), id(pan_pos), id(pan_moving));
          step(id(servo_tilt), id(tilt_target), id(tilt_mid), id(tilt_pos), id(tilt_moving));

# -----------------------------------------------------------------------------
# API de ESPHome.
# Canal de control con el servicio Python (aioesphomeapi) y con Home Assistant.
# Al conectar el cliente se publica `awake`=ON; esta placa está siempre
# encendida, así que nunca pasa a OFF.
#
# `set_servo_position` es el contrato con el lado Python: es el nombre por
# defecto de `ServoConfig.service` en detect/servo_tracker.py. Si se renombra
# aquí hay que cambiarlo también en `POST /cameras/<id>/config/servo`, o el
# seguimiento queda mudo sin dar ningún error. `pan` y `tilt` van en el rango
# -1.0 .. 1.0, que es lo que espera `servo.write`.
# -----------------------------------------------------------------------------
api:
  encryption:
    # Clave propia de esta placa, generada al crear el fichero. Si prefieres una
    # tuya: `openssl rand -base64 32`. Sea cual sea, tiene que coincidir con el
    # `noise_psk` de esta cámara en detect/cameras_config.json.
    key: "KEcsQUr/bjV+LS6s39eI62jJeJ5o5hyBKLXDiBEvUOU="
  on_client_connected:
    then:
      # delay de 100ms para que la API esté lista antes de enviar el estado
      - delay: 100ms
      - logger.log: "api: client connected, sending awake ON"
      - lambda: |-
          id(awake).publish_state(true);
  actions:
    - action: set_servo_position
      variables:
        pan: float
        tilt: float
      then:
        # Solo fija el objetivo: el interval de los servos lleva hasta él.
        - lambda: |-
            id(pan_target) = std::max(-1.0f, std::min(1.0f, pan));
            id(pan_moving) = true;
            id(tilt_target) = std::max(-1.0f, std::min(1.0f, tilt));
            id(tilt_moving) = true;
    # Con el seguimiento activo el servicio Python manda hold=true (y lo repite
    # cada pocos segundos): auto-detach a 0. Con el PWM cortado el servo
    # obedece a picos espurios de la señal y el pan giraba solo ~30°. Con
    # hold=false (seguimiento apagado), o si pasan 10 s sin
    # refresco, vuelve el valor del number "Servo auto detach". El number no
    # se toca: es el ajuste del usuario y se restaura al arrancar.
    - action: set_servo_hold
      variables:
        hold: bool
      then:
        - lambda: |-
            id(servo_hold) = hold;
            id(servo_hold_until) = millis() + 10000;
            uint32_t ad = hold ? 0 : (uint32_t) (id(servo_auto_detach).state * 1000.0f);
            id(servo_pan).set_auto_detach_time(ad);
            id(servo_tilt).set_auto_detach_time(ad);

ota:
  - platform: esphome
    # Propia de esta placa, no copiada de otra.
    password: "e75a72bc03519a4b9a8e0bfbe6dbf83f"

http_request:
  timeout: 2s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  power_save_mode: none
  output_power: 8.5

  ap:
    ssid: "Fallback Hotspot"
    password: "teta1234"

  on_connect:
    - logger.log: "WiFi connected"
    # Solo avisa al servidor Python si `server_awake_url` no está en blanco.
    - if:
        condition:
          lambda: "return !id(server_awake_url).state.empty();"
        then:
          - http_request.post:
              url: !lambda "return id(server_awake_url).state;"
              on_error:
                - logger.log: "No se pudo avisar al servidor Python (no pasa nada, seguirá reintentando solo)"
  on_disconnect:
    - logger.log: "WiFi disconnected"

# -----------------------------------------------------------------------------
# Cámara ESP32-S3 (mismo hardware y pinout que esp32-s3-cam.yaml).
# -----------------------------------------------------------------------------
i2c:
  - id: i2c_bus
    sda: GPIO4
    scl: GPIO5

esp32_camera:
  name: "Cam"
  id: cam
  external_clock:
    pin: GPIO15
    frequency: 13MHz
  i2c_id: i2c_bus
  data_pins: [GPIO11, GPIO9, GPIO8, GPIO10, GPIO12, GPIO18, GPIO17, GPIO16]  # D0..D7
  vsync_pin: GPIO6
  href_pin: GPIO7
  pixel_clock_pin: GPIO13

  resolution: 1600X1200 # 800x600 320x240 640x480

  frame_buffer_count: 2

  idle_framerate: 0.1 fps
  vertical_flip: false
  horizontal_mirror: false

esp32_camera_web_server:
  - port: 8080
    mode: stream
  - port: 8081
    mode: snapshot

captive_portal:

safe_mode:

binary_sensor:
  - platform: template
    name: "Awake"
    id: awake
    device_class: running
    entity_category: diagnostic

# -----------------------------------------------------------------------------
# Entidades de control de la cámara (ajustables en runtime sin recompilar).
# -----------------------------------------------------------------------------
switch:
  - platform: template
    name: "Cam AEC2"
    id: cam_aec2
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: |-
          id(cam)->set_aec2(true);
          id(cam)->update_camera_parameters();
    turn_off_action:
      - lambda: |-
          id(cam)->set_aec2(false);
          id(cam)->update_camera_parameters();

number:
  - platform: template
    name: "Cam XCLK (MHz)"
    id: cam_xclk_mhz
    min_value: 8
    max_value: 24   # 20MHz es lo habitual máximo estable, 24MHz es overclock
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 8
    set_action:
      - lambda: |-
          sensor_t *s = esp_camera_sensor_get();
          if (s != nullptr) {
            s->set_xclk(s, LEDC_TIMER_0, (int)x);
          }
  - platform: template
    name: "Cam JPEG Quality"
    id: cam_jpeg_quality
    min_value: 6
    max_value: 63
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 12
    set_action:
      - lambda: |-
          sensor_t *s = esp_camera_sensor_get();
          if (s != nullptr) {
            // Llama directamente al driver del sensor. Números bajos = mejor calidad
            s->set_quality(s, (int)x);
          }
  - platform: template
    name: "Cam Max Framerate"
    id: cam_max_framerate
    min_value: 1
    max_value: 30
    step: 1
    unit_of_measurement: "fps"
    optimistic: true
    restore_value: true
    initial_value: 20
    set_action:
      - lambda: |-
          if (x > 0) {
            id(cam)->set_max_update_interval((uint32_t)(1000.0f / x));
          }

  - platform: template
    name: "Cam AE Level"
    id: cam_ae_level
    min_value: -2
    max_value: 2
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 0
    set_action:
      - lambda: |-
          id(cam)->set_ae_level((int) x);
          id(cam)->update_camera_parameters();

  - platform: template
    name: "Cam AGC Gain Ceiling"
    id: cam_gain_ceiling
    min_value: 0
    max_value: 6    # 0=2x, 1=4x, 2=8x, 3=16x, 4=32x, 5=64x, 6=128x
    step: 1
    optimistic: true
    restore_value: true
    set_action:
      - lambda: |-
          id(cam)->set_agc_gain_ceiling(
            (esphome::esp32_camera::ESP32AgcGainCeiling)((int)x)
          );
          id(cam)->update_camera_parameters();

  # En unidades de servo, no en grados: HA habla directo con la placa y no
  # pasa por la conversión del lado Python. ±0.9 y no ±1: el mismo límite por
  # defecto que pan_limit_deg/tilt_limit_deg (detect/servo_tracker.py), y los
  # extremos del PWM suelen coincidir con el tope mecánico.
  - platform: template
    name: "Servo Pan"
    id: servo_pan_number
    min_value: -0.9
    max_value: 0.9
    step: 0.01
    optimistic: true
    restore_value: false
    initial_value: 0
    set_action:
      - lambda: |-
          id(pan_target) = x;
          id(pan_moving) = true;
  - platform: template
    name: "Servo Tilt"
    id: servo_tilt_number
    min_value: -0.9
    max_value: 0.9
    step: 0.01
    optimistic: true
    restore_value: false
    initial_value: 0
    set_action:
      - lambda: |-
          id(tilt_target) = x;
          id(tilt_moving) = true;

  # Velocidad máxima de los servos, como tiempo de recorrido completo
  # (-1 -> +1) en caliente. 0 = sin límite. Lo lee el interval de los servos
  # en cada pasada, así que no necesita set_action. El servicio Python lo lee
  # (object_id servo_transition) para mostrarlo en /status.
  - platform: template
    name: "Servo transition"
    id: servo_transition
    entity_category: config
    mode: box
    unit_of_measurement: s
    min_value: 0
    max_value: 5
    step: 0.05
    optimistic: true
    restore_value: true
    initial_value: 1.0

  # Suavizado del arranque y la frenada: la `tau` de la fórmula de Flash
  # (ver MOVIMIENTO arriba). Hace ~95% del camino en 3 tau. 0 = sin suavizar,
  # la transición lineal de antes. Bajo: con el seguimiento mandando cada
  # 0.2 s, un tau grande retrasa la torreta y el lazo oscila.
  - platform: template
    name: "Servo smoothing"
    id: servo_smoothing
    entity_category: config
    mode: box
    unit_of_measurement: s
    min_value: 0
    max_value: 0.5
    step: 0.01
    optimistic: true
    restore_value: true
    initial_value: 0.03

  # Segundos quieto tras los que se corta el PWM del servo (menos zumbido y
  # calor). Es el auto_detach_time del bloque servo, en caliente. 0 = nunca.
  # Con el hold del seguimiento activo no se aplica: se aplicará al soltarlo.
  - platform: template
    name: "Servo auto detach"
    id: servo_auto_detach
    entity_category: config
    mode: box
    unit_of_measurement: s
    min_value: 0
    max_value: 30
    step: 0.5
    optimistic: true
    restore_value: true
    initial_value: 2
    set_action:
      - lambda: |-
          if (id(servo_hold)) return;
          id(servo_pan).set_auto_detach_time((uint32_t) (x * 1000.0f));
          id(servo_tilt).set_auto_detach_time((uint32_t) (x * 1000.0f));

select:
  - platform: template
    name: "Cam Resolution"
    id: cam_resolution
    options:
      - "QVGA (320x240)"
      - "VGA (640x480)"
      - "SVGA (800x600)"
      - "HD (1280x720)"
      - "UXGA (1600x1200)"
    initial_option: "VGA (640x480)"
    optimistic: true
    restore_value: true
    set_action:
      - lambda: |-
          sensor_t *s = esp_camera_sensor_get();
          if (s != nullptr) {
            framesize_t frame = FRAMESIZE_VGA;
            if (x == "QVGA (320x240)") frame = FRAMESIZE_QVGA;
            else if (x == "VGA (640x480)") frame = FRAMESIZE_VGA;
            else if (x == "SVGA (800x600)") frame = FRAMESIZE_SVGA;
            else if (x == "HD (1280x720)") frame = FRAMESIZE_HD;
            else if (x == "UXGA (1600x1200)") frame = FRAMESIZE_UXGA;

            // Aplica la resolución directamente al hardware
            s->set_framesize(s, frame);
          }

text:
  - platform: template
    name: "Server awake URL"
    id: server_awake_url
    entity_category: config
    mode: text
    optimistic: true
    restore_value: true
    min_length: 0
    max_length: 255
    initial_value: "http://192.168.1.171:8080/cameras/esp32-s3-cam-servo/esphome/awake"

# -----------------------------------------------------------------------------
# Botones de control y diagnóstico.
# Los dos de centrado sirven para comprobar el recorrido mecánico de la torreta
# sin necesidad de tener el servicio Python levantado.
# -----------------------------------------------------------------------------
button:
  - platform: restart
    name: "Restart"
    entity_category: config

  - platform: safe_mode
    name: "Safe Mode"
    internal: false
    entity_category: config

  - platform: template
    name: "Servos home"
    entity_category: config
    on_press:
      # number.set pasa por el set_action del number, así que mueve el servo
      # y actualiza el slider de HA a la vez.
      - number.set:
          id: servo_pan_number
          value: 0
      - number.set:
          id: servo_tilt_number
          value: 0

sensor:
  - platform: internal_temperature
    name: "Temperature"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    id: uptime_sensor
    entity_category: diagnostic
    internal: true

  - platform: wifi_signal
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"

# -----------------------------------------------------------------------------
# Componente `esp32_camera` local con `grab_mode = CAMERA_GRAB_LATEST`, para que
# la cámara entregue siempre el frame más reciente en vez de acumular antiguos.
# Ver la nota larga en esp32-s3-cam.yaml.
# -----------------------------------------------------------------------------
external_components:
  - source:
      type: local
      path: components
    components: [esp32_camera]
