esphome:
  name: s3proxy2
  friendly_name: s3proxy2

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB  
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      # --- AJUSTES SDKCONFIG DE BERMUDA ---
      # Soportado por todos los ESP32 con Bluetooth
      CONFIG_BT_BLE_42_FEATURES_SUPPORTED: "y"
      
      # [DIFERENCIA S3 vs ESP32 COMÚN]:
      # El ESP32 original (WROOM/WROVER) solo soporta BLE 4.2.
      # Los derivativos modernos como ESP32-S3 y ESP32-C3 soportan BLE 5.0, 
      # por lo que esta opción solo se habilita en variantes S3/C3.
      CONFIG_BT_BLE_50_FEATURES_SUPPORTED: "y"
      
      # Amplía el tiempo de espera del watchdog a 10s para reiniciar si el chip se bloquea
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "10"

psram:
  mode: octal
  speed: 80MHz

# Logger con baud_rate a 0 para desactivar el log por puerto serie (UART).
# Esto libera CPU y memoria RAM, evitando cuellos de botella en la recepción BLE.
logger:
  baud_rate: 0

# API con control dinámico del escaneo BLE
# El escaneo solo arranca cuando la Wi-Fi y Home Assistant están completamente conectados.
# [DIFERENCIA S3 vs ESP32 COMÚN]:
# En el ESP32-S3 (y especialmente en el C3) arrancar el escaneo BLE durante la conexión Wi-Fi
# suele provocar inestabilidad en la pila de red; esta gestión de eventos lo soluciona.
api:
  encryption:
    key: "3LLTuu1TM7MISYmZ/BJYPfeg9FtBMdlRdXcUI4Bu2pk="
  on_client_connected:
    - esp32_ble_tracker.start_scan:
        continuous: true
  on_client_disconnected:
    if:
      condition:
        not:
          api.connected:
      then:
        - esp32_ble_tracker.stop_scan:

ota:
  - platform: esphome
    password: "2b12ceab43272723526c8fc93ea6630e"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 8.5 #17.0
  power_save_mode: none 

  ap:
    ssid: "S3Proxy Fallback Hotspot"
    password: "teta1234"

captive_portal:

# Configuración del escáner BLE
esp32_ble_tracker:
  scan_parameters:
    # Desactivamos el inicio automático porque se controla arriba mediante el evento de la API
    continuous: false
    
    # Send scan-request packets para recopilar más info (como nombres de dispositivos)
    active: true
    
    # Tiempo gastado en cada canal de anuncio BLE (por defecto 320ms)
    interval: 320ms
    
    # Tiempo efectivo de escucha dentro del intervalo. 300ms sobre 320ms representa 
    # más del 93% de ciclo útil de escucha sin saturar la CPU por completo.
    window: 300ms

# Proxy Bluetooth para conectar Home Assistant a dispositivos lejanos
bluetooth_proxy:
  # Permite conexiones salientes desde Home Assistant hacia dispositivos Bluetooth a través del proxy
  active: true

safe_mode: 

esp32_ble_beacon:
  type: iBeacon
  uuid: fde3b150-2f64-43ba-aee9-867f75ee4a6f
  major: 1
  minor: 3
  min_interval: 500ms
  max_interval: 1000ms 

# Entidades de diagnóstico y control integradas en Home Assistant
button:
  - platform: restart
    name: "Restart"
    entity_category: config

  - platform: safe_mode
    name: "Safe Mode"
    internal: false
    entity_category: config

sensor:
  - platform: uptime
    name: "Uptime"
    id: uptime_sensor
    entity_category: diagnostic
    internal: true

  - platform: wifi_signal
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"