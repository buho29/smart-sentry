esphome:
  name: s3proxy
  friendly_name: s3proxy

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB  
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      # --- AJUSTES SDKCONFIG DE BERMUDA ---
      # Soportado por todos los ESP32 con Bluetooth
      CONFIG_BT_BLE_42_FEATURES_SUPPORTED: "y"
      
      # Los derivativos modernos como ESP32-S3 y ESP32-C3 soportan BLE 5.0, 
      # por lo que esta opción solo se habilita en variantes S3/C3.
      CONFIG_BT_BLE_50_FEATURES_SUPPORTED: "y"
      
      # Amplía el tiempo de espera del watchdog a 10s para reiniciar si el chip se bloquea
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "10"

# --- CONFIGURACIÓN DE LA MEMORIA PSRAM (RAM EXTERNA) ---
# - mode: octal -> Utiliza un bus de 8 líneas de datos en lugar de 4 (Quad). Ofrece el doble de ancho de banda.
# - speed: 80MHz -> Establece la frecuencia de reloj del bus de la memoria al máximo rendimiento soportado.
psram:
  mode: octal
  speed: 80MHz


# Logger con baud_rate a 0 para desactivar el log por puerto serie (UART).
# Esto libera CPU y memoria RAM
logger:
  baud_rate: 0

# --- CONFIGURACIÓN DE API Y CONTROL DINÁMICO DE ESCANEO BLE ---
api:
  # Clave criptográfica para autenticar y cifrar la comunicación entre ESPHome y Home Assistant
  encryption:
    key: "gDswOA1i7zuTLQOwGv0L4q11+Cv6g+Qb4Lb8z/GeRmk="
  
  # Evento que se activa inmediatamente tras establecer la conexión con Home Assistant
  on_client_connected:
    # Inicia el escaneo continuo de dispositivos Bluetooth únicamente cuando la API está lista
    - esp32_ble_tracker.start_scan:
        continuous: true

  # Evento que se activa si la conexión con Home Assistant se interrumpe
  on_client_disconnected:
    # Verifica que realmente no quede ninguna otra conexión activa en el puerto de la API
    if:
      condition:
        not:
          api.connected:
      # Detiene el escáner BLE para liberar la antena Wi-Fi y facilitar la reconexión[cite: 1]
      then:
        - esp32_ble_tracker.stop_scan:

# --- ACTUALIZACIONES INALÁMBRICAS (OTA - Over-The-Air) ---
# Permite flashear y actualizar el firmware del ESP32 directamente a través de la red Wi-Fi,
# sin necesidad de conectar el dispositivo por cable USB al ordenador.
ota:
  # Plataforma nativa de actualización inalámbrica de ESPHome
  - platform: esphome
    # Contraseña de seguridad que autentica las peticiones de actualización iniciadas desde Home Assistant o la CLI de ESPHome
    password: "0b933bfe0ac9aec79176365ccbc108dc"
    
# --- CONFIGURACIÓN DE RED WI-FI Y PUNTO DE ACCESO DE RESPALDO ---
wifi:
  # Credenciales de red leídas de forma segura desde el archivo secrets.yaml
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Potencia de transmisión de la antena Wi-Fi medida en dBm (rango habitual: 8.5 a 20.0 dBm).
  # Con el s3 he tendido q bajarlo o el router rechazaba la conexion :/
  output_power: 8.5

  # Desactiva el modo de ahorro de energía de la tarjeta Wi-Fi.
  power_save_mode: none 

  # Punto de acceso (Hotspot Wi-Fi) de emergencia de la propia placa
  # Se activa automáticamente solo si el ESP32 no consigue conectarse a la red principal.
  ap:
    ssid: "S3Proxy Fallback Hotspot"
    password: "teta1234"

# --- PORTAL CAUTIVO DE CONFIGURACIÓN ---
# Despliega una interfaz web de configuración cuando el ESP32 no logra conectarse a la red Wi-Fi principal
# y se activa el punto de acceso de respaldo (Fallback Hotspot).
captive_portal:

# Configuración del escáner BLE
esp32_ble_tracker:
  scan_parameters:
    # Desactivamos el inicio automático porque se controla arriba mediante el evento de la API
    continuous: false
    # Send scan-request packets para recopilar más info (como nombres de dispositivos)
    active: true
    # Tiempo gastado en cada canal de anuncio BLE (por defecto 320ms)
    interval: 320ms
    # Tiempo efectivo de escucha dentro del intervalo. 300ms sobre 320ms representa 
    # más del 93% de ciclo útil de escucha sin saturar la CPU por completo.
    window: 300ms

# Proxy Bluetooth para conectar Home Assistant a dispositivos lejanos
bluetooth_proxy:
  # Permite conexiones salientes desde Home Assistant hacia dispositivos Bluetooth a través del proxy
  active: true

# --- MODO SEGURO DE RECUPERACIÓN (SAFE MODE) ---
# Habilita un mecanismo de protección que detecta fallos de arranque o reinicios en bucle (bootloops).
#
# En este modo:
# 1. Mantiene activa la conectividad Wi-Fi y la interfaz OTA.
# 2. Desactiva temporalmente el escáner BLE y la API para no saturar el sistema.
# 3. Te permite flashear una nueva versión corregida del firmware por Wi-Fi de forma segura.
safe_mode:

# --- EMISOR iBEACON PARA AUTO-CALIBRACIÓN EN BPS (Bermuda Positioning System) ---
# Permite que las sondas/proxies de la red se midan y calibren entre sí de forma automática.
#
# 1. Cada proxy emite este iBeacon estático mientras escucha a sus proxies vecinos ("probes").
# 2. BPS compara la distancia calculada por RSSI entre los proxies con su posición física real en el mapa.
# 3. La diferencia permite corregir automáticamente el margen de error del receptor 
#    (causado por el tipo de antena, la caja/envolvente impresa o la ubicación del montaje) 
#    sin necesidad de calibración manual dispositivo por dispositivo.
#
# Requisito: Todas las sondas deben compartir el mismo UUID/Major, pero con un 'minor' único.
esp32_ble_beacon:
  type: iBeacon
  uuid: fde3b150-2f64-43ba-aee9-867f75ee4a6f
  major: 1
  minor: 2 # Debe ser único en cada ESP32 (ej. la última cifra de su IP estática)

# --- INYECTOR PARA VENTILADOR Y LÁMPARA (FanLamp Pro) ---
# Componente externo para enviar comandos publicitarios BLE (BLE Advertisements)
# diseñados específicamente para el control de ventiladores de techo y lámparas compatibles con FanLamp Pro.
external_components:
  - source: github://NicoIIT/esphome-ble_adv_proxy

ble_adv_proxy:
  # Forzar el uso de la máxima potencia de transmisión de la radio Bluetooth del ESP32.
  # Garantiza que las ráfagas de comandos BLE alcancen al ventilador/lámpara incluso a través de paredes o techos.
  use_max_tx_power: true  

# --- ENTIDADES DE CONTROL Y DIAGNÓSTICO PARA HOME ASSISTANT ---
# Expone botones de control administrativo y sensores de salud del hardware 
# directamente en la interfaz de Home Assistant bajo la pestaña de diagnóstico del dispositivo.
button:
  # Botón para reiniciar el microcontrolador de forma remota
  # Útil si la pila Bluetooth se congela o si necesitas forzar una reconexión limpia con la API
  - platform: restart
    name: "Restart"
    entity_category: config

  # Botón para orquestar un reinicio manual directamente en Modo Seguro (Safe Mode)
  # Detiene el escaneo BLE y la API para permitir actualizaciones OTA estables si el sistema está inestable
  - platform: safe_mode
    name: "Safe Mode"
    internal: false
    entity_category: config

sensor:
  # Mide el tiempo ininterrumpido (en segundos) que lleva encendido el ESP32
  # Marca 'internal: true' para no saturar la base de datos de Home Assistant con un sensor que cambia cada segundo
  - platform: uptime
    name: "Uptime"
    id: uptime_sensor
    entity_category: diagnostic
    internal: true

  # Mide la intensidad del enlace Wi-Fi con el router en dBm cada 60 segundos
  # CRÍTICO EN BERMUDA/BPS: Si este valor cae por debajo de -75 dBm, la latencia aumentará 
  # y causará pérdidas de paquetes RSSI, provocando saltos a "distancia desconocida"
  - platform: wifi_signal
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"