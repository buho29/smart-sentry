# Package de Home Assistant: cámara "torreta" del servicio detect.
#
# Variante cámara + servos pan/tilt (firmware esphome/esp32-s3-cam-servo.yaml).
# Para otra torreta: copia el fichero y reemplaza "torreta" por su camera_id
# (en ids, URLs y nombres). Ver ../README.md.
#
# La IP del servicio sale de input_text.detect_host (detect_servicio.yaml).
#
# El vídeo no está aquí: la cámara MJPEG se añade desde la UI de HA con el
# nombre "Detect torreta", para que quede como camera.detect_torreta.
#
# Posiciones de servo en las mismas unidades que la API: -1 = un extremo,
# 0 = reposo, 1 = el otro. El servicio recorta cada orden a ±pan_limit /
# ±tilt_limit, así que el slider puede pedir más de lo que luego se envía.

rest_command:
  detect_torreta_start:
    url: "http://{{ states('input_text.detect_host') }}:8080/cameras/torreta/start"
    method: post
    timeout: 20
  detect_torreta_stop:
    url: "http://{{ states('input_text.detect_host') }}:8080/cameras/torreta/stop"
    method: post
    timeout: 20

  detect_torreta_inference:
    url: "http://{{ states('input_text.detect_host') }}:8080/cameras/torreta/config/inference"
    method: post
    content_type: "application/json"
    payload: "{{ body | to_json }}"
    # Cambiar de modelo relanza la sesión y carga los pesos: tarda.
    timeout: 60

  # POST /config/recording es un form que sustituye la config de grabación
  # entera (lo que no se manda vuelve al valor por defecto, y el de source es
  # "annotated"). Por eso se reenvía todo lo que ya tiene, en `rec`, cambiando
  # solo trigger_on_detection.
  detect_torreta_recording_config:
    url: "http://{{ states('input_text.detect_host') }}:8080/cameras/torreta/config/recording"
    method: post
    content_type: "application/x-www-form-urlencoded"
    payload: >-
      enabled={{ 'true' if rec.enabled else 'false' }}&source={{ rec.source }}&trigger_on_detection={{ 'true' if trigger else 'false' }}&min_hits={{ rec.min_hits }}&pre_roll_sec={{ rec.pre_roll_sec }}&post_roll_sec={{ rec.post_roll_sec }}&max_clip_sec={{ rec.max_clip_sec }}&min_clip_sec={{ rec.min_clip_sec }}&cooldown_sec={{ rec.cooldown_sec }}{% if rec.fps is not none %}&fps={{ rec.fps }}{% endif %}
    timeout: 20

  detect_torreta_stream:
    url: "http://{{ states('input_text.detect_host') }}:8080/cameras/torreta/config/stream"
    method: post
    content_type: "application/x-www-form-urlencoded"
    payload: "default_infer={{ 'true' if default_infer else 'false' }}"
    timeout: 20

  # Control manual directo. Funciona con el seguimiento encendido, pero el
  # seguimiento la volverá a mover en cuanto vea algo.
  detect_torreta_servo_move:
    url: "http://{{ states('input_text.detect_host') }}:8080/cameras/torreta/servo"
    method: post
    content_type: "application/json"
    payload: '{"pan": {{ pan | float(0) }}, "tilt": {{ tilt | float(0) }}}'
    timeout: 10

  # Graba a mano, con el pre-roll que hubiera. Necesita que la cámara tenga
  # grabación configurada (POST /cameras/torreta/config/recording).
  detect_torreta_record_start:
    url: "http://{{ states('input_text.detect_host') }}:8080/cameras/torreta/record/start"
    method: post
    content_type: "application/x-www-form-urlencoded"
    payload: "note={{ note | default('Home Assistant') | urlencode }}"
    timeout: 10
  detect_torreta_record_stop:
    url: "http://{{ states('input_text.detect_host') }}:8080/cameras/torreta/record/stop"
    method: post
    timeout: 20

  # Config de la torreta (JSON, lo que no se manda se conserva).
  detect_torreta_servo_config:
    url: "http://{{ states('input_text.detect_host') }}:8080/cameras/torreta/config/servo"
    method: post
    content_type: "application/json"
    payload: "{{ body | to_json }}"
    timeout: 20

rest:
  - resource_template: "http://{{ states('input_text.detect_host') }}:8080/cameras/torreta/status"
    scan_interval: 10
    timeout: 10
    binary_sensor:
      - name: "Detect torreta running"
        unique_id: detect_torreta_running
        device_class: running
        value_template: "{{ value_json.running }}"
      - name: "Detect torreta esphome"
        unique_id: detect_torreta_esphome
        device_class: connectivity
        value_template: "{{ value_json.esphome_connected | default(false, true) }}"
      - name: "Detect torreta annotated"
        unique_id: detect_torreta_annotated
        value_template: "{{ value_json.config.default_infer }}"
      - name: "Detect torreta always infer"
        unique_id: detect_torreta_always_infer
        value_template: "{{ value_json.config.always_infer }}"
      # Seguimiento automático encendido.
      - name: "Detect torreta tracking"
        unique_id: detect_torreta_tracking
        value_template: "{{ value_json.consumers.get('ServoTracker', {}).get('enabled', false) }}"
      # Si la placa publica el servicio de servos. Apagado con la placa
      # conectada = firmware sin servos: la torreta no se moverá.
      - name: "Detect torreta servo service"
        unique_id: detect_torreta_servo_service
        device_class: connectivity
        value_template: "{{ value_json.consumers.get('ServoTracker', {}).get('servo_service', false) }}"
      - name: "Detect torreta recording"
        unique_id: detect_torreta_recording
        icon: mdi:record-rec
        value_template: >-
          {{ value_json.consumers.get('ClipRecorder', {}).get('state') == 'recording' }}
    sensor:
      - name: "Detect torreta fps"
        unique_id: detect_torreta_fps
        unit_of_measurement: "fps"
        state_class: measurement
        value_template: "{{ value_json.pipeline_fps }}"
      - name: "Detect torreta inference"
        unique_id: detect_torreta_inference_ms
        unit_of_measurement: "ms"
        state_class: measurement
        value_template: "{{ value_json.last_inference_ms | round(1) if value_json.last_inference_ms is not none else 0 }}"
      - name: "Detect torreta corrupt frames"
        unique_id: detect_torreta_corrupt_frames
        state_class: total_increasing
        icon: mdi:image-broken-variant
        value_template: "{{ value_json.corrupt_frames }}"
      - name: "Detect torreta clients"
        unique_id: detect_torreta_clients
        icon: mdi:account-eye
        value_template: "{{ value_json.clients }}"
        # Los binary_sensor de rest no admiten atributos: los de la cámara van aquí.
        json_attributes:
          - explicit_start
          - manual_stop
          - last_frame_time
      - name: "Detect torreta confidence"
        unique_id: detect_torreta_confidence
        icon: mdi:target
        value_template: "{{ value_json.config.confidence }}"
        json_attributes_path: "$.config"
        json_attributes:
          - model_name
          - device
          - imgsz
          - classes
          - rotation
          # Config de grabación entera (null sin grabación configurada).
          - recording
      # Última posición enviada (la real, ya recortada a los límites).
      - name: "Detect torreta pan"
        unique_id: detect_torreta_pan
        icon: mdi:pan-horizontal
        value_template: "{{ value_json.consumers.get('ServoTracker', {}).get('pan', 0) }}"
        # Estado del seguimiento (los binary_sensor de rest no admiten atributos).
        json_attributes_path: "$.consumers.ServoTracker"
        json_attributes:
          - service
          - target_id
          - last_target
          - sends
          - transition_sec
          - auto_detach_sec
      - name: "Detect torreta tilt"
        unique_id: detect_torreta_tilt
        icon: mdi:pan-vertical
        value_template: "{{ value_json.consumers.get('ServoTracker', {}).get('tilt', 0) }}"
      # Si sube, el disco no da abasto y el clip tendrá saltos.
      - name: "Detect torreta dropped frames"
        unique_id: detect_torreta_dropped_frames
        icon: mdi:filmstrip-off
        value_template: "{{ value_json.consumers.get('ClipRecorder', {}).get('dropped_frames', 0) }}"
        # Estado del grabador (sin grabación configurada, el sensor queda sin atributos).
        json_attributes_path: "$.consumers.ClipRecorder"
        json_attributes:
          - state
          - trigger
          - current_clip
          - elapsed_sec
          - clips_written
          - last_error

  # El último clip terminado (los que se están grabando no salen hasta cerrarse).
  - resource_template: "http://{{ states('input_text.detect_host') }}:8080/recordings?camera_id=torreta&limit=1"
    scan_interval: 60
    timeout: 20
    sensor:
      - name: "Detect torreta last clip"
        unique_id: detect_torreta_last_clip
        icon: mdi:filmstrip
        value_template: "{{ value_json.clips[0].clip_id if value_json.clips else 'ninguno' }}"
        json_attributes_path: "$.clips[0]"
        json_attributes:
          - clip_id
          - url
          - thumbnail_url
          - trigger
          - note
          - started_at
          - duration_sec
          - labels
          - max_conf

template:
  - switch:
      - name: "Detect torreta camera"
        unique_id: detect_torreta_camera_switch
        icon: mdi:cctv
        state: "{{ is_state('binary_sensor.detect_torreta_running', 'on') }}"
        turn_on:
          - action: rest_command.detect_torreta_start
          - action: homeassistant.update_entity
            target:
              entity_id: binary_sensor.detect_torreta_running
        turn_off:
          - action: rest_command.detect_torreta_stop
          - action: homeassistant.update_entity
            target:
              entity_id: binary_sensor.detect_torreta_running

      # Seguimiento automático. Apagado, la torreta se queda quieta pero sigue
      # obedeciendo al control manual.
      - name: "Detect torreta follow"
        unique_id: detect_torreta_follow_switch
        icon: mdi:crosshairs-gps
        state: "{{ is_state('binary_sensor.detect_torreta_tracking', 'on') }}"
        turn_on:
          - action: rest_command.detect_torreta_servo_config
            data:
              body: { enabled: true }
          - action: homeassistant.update_entity
            target:
              entity_id: binary_sensor.detect_torreta_running
        turn_off:
          - action: rest_command.detect_torreta_servo_config
            data:
              body: { enabled: false }
          - action: homeassistant.update_entity
            target:
              entity_id: binary_sensor.detect_torreta_running

      - name: "Detect torreta record"
        unique_id: detect_torreta_record_switch
        icon: mdi:record-rec
        state: "{{ is_state('binary_sensor.detect_torreta_recording', 'on') }}"
        turn_on:
          - action: rest_command.detect_torreta_record_start
            data:
              note: "Home Assistant"
          - action: homeassistant.update_entity
            target:
              entity_id: binary_sensor.detect_torreta_running
        turn_off:
          - action: rest_command.detect_torreta_record_stop
          - action: homeassistant.update_entity
            target:
              entity_id:
                - binary_sensor.detect_torreta_running
                - sensor.detect_torreta_last_clip

      # Grabar solo al detectar (trigger_on_detection). Apagado, la torreta
      # solo graba a mano. Sin grabación configurada no está disponible.
      - name: "Detect torreta auto record"
        unique_id: detect_torreta_auto_record_switch
        icon: mdi:record-circle-outline
        availability: "{{ state_attr('sensor.detect_torreta_confidence', 'recording') is mapping }}"
        state: "{{ (state_attr('sensor.detect_torreta_confidence', 'recording') or {}).get('trigger_on_detection', false) }}"
        turn_on:
          - action: rest_command.detect_torreta_recording_config
            data:
              rec: "{{ state_attr('sensor.detect_torreta_confidence', 'recording') }}"
              trigger: true
          - action: homeassistant.update_entity
            target:
              entity_id: binary_sensor.detect_torreta_running
        turn_off:
          - action: rest_command.detect_torreta_recording_config
            data:
              rec: "{{ state_attr('sensor.detect_torreta_confidence', 'recording') }}"
              trigger: false
          - action: homeassistant.update_entity
            target:
              entity_id: binary_sensor.detect_torreta_running

      - name: "Detect torreta boxes"
        unique_id: detect_torreta_boxes_switch
        icon: mdi:vector-rectangle
        state: "{{ is_state('binary_sensor.detect_torreta_annotated', 'on') }}"
        turn_on:
          - action: rest_command.detect_torreta_stream
            data:
              default_infer: true
          - action: homeassistant.update_entity
            target:
              entity_id: binary_sensor.detect_torreta_running
        turn_off:
          - action: rest_command.detect_torreta_stream
            data:
              default_infer: false
          - action: homeassistant.update_entity
            target:
              entity_id: binary_sensor.detect_torreta_running

      - name: "Detect torreta detect always"
        unique_id: detect_torreta_detect_always_switch
        icon: mdi:radar
        state: "{{ is_state('binary_sensor.detect_torreta_always_infer', 'on') }}"
        turn_on:
          - action: rest_command.detect_torreta_inference
            data:
              body: { always_infer: true }
          - action: homeassistant.update_entity
            target:
              entity_id: binary_sensor.detect_torreta_running
        turn_off:
          - action: rest_command.detect_torreta_inference
            data:
              body: { always_infer: false }
          - action: homeassistant.update_entity
            target:
              entity_id: binary_sensor.detect_torreta_running

input_number:
  detect_torreta_confidence:
    name: "Detect torreta confianza"
    icon: mdi:target
    min: 0.05
    max: 0.95
    step: 0.05
    mode: slider
  detect_torreta_pan:
    name: "Detect torreta pan"
    icon: mdi:pan-horizontal
    min: -1
    max: 1
    step: 0.05
    mode: slider
  detect_torreta_tilt:
    name: "Detect torreta tilt"
    icon: mdi:pan-vertical
    min: -1
    max: 1
    step: 0.05
    mode: slider

# Ajustes de detección. Cada uno se envía al cambiarlo y se resincroniza con
# lo que reporta el servicio (automatizaciones de abajo).
input_select:
  detect_torreta_model:
    name: "Detect torreta modelo"
    icon: mdi:brain
    options: [yolo26n, yolo26s, yolo26m, yolo11n, yolo11m]
  detect_torreta_imgsz:
    name: "Detect torreta imgsz"
    icon: mdi:image-size-select-large
    options: ["320", "480", "640", "960"]

# Clases COCO que detecta: el array se monta con las casillas marcadas, y
# ninguna marcada = todas las clases (classes: null). Una clase puesta desde
# Swagger que no tenga casilla no se ve, y se pierde al tocar una casilla.
input_boolean:
  detect_torreta_class_person:
    name: "Detect torreta personas"
    icon: mdi:human
  detect_torreta_class_car:
    name: "Detect torreta coches"
    icon: mdi:car
  detect_torreta_class_bird:
    name: "Detect torreta pájaros"
    icon: mdi:bird
  detect_torreta_class_cat:
    name: "Detect torreta gatos"
    icon: mdi:cat
  detect_torreta_class_dog:
    name: "Detect torreta perros"
    icon: mdi:dog

script:
  # Mueve la torreta a una posición absoluta y refresca los sensores.
  detect_torreta_move:
    alias: "Detect torreta: mover"
    icon: mdi:arrow-all
    mode: restart
    fields:
      pan:
        description: "-1 a 1"
        example: 0
      tilt:
        description: "-1 a 1"
        example: 0
    variables:
      p: "{{ [[pan | float(0), -1] | max, 1] | min }}"
      t: "{{ [[tilt | float(0), -1] | max, 1] | min }}"
    sequence:
      - action: rest_command.detect_torreta_servo_move
        data:
          pan: "{{ p }}"
          tilt: "{{ t }}"
      # Los sliders se ponen ya en la posición pedida: son la referencia de
      # las flechas, porque el sensor tarda (ver detect_torreta_step).
      - action: input_number.set_value
        target:
          entity_id: input_number.detect_torreta_pan
        data:
          value: "{{ p }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.detect_torreta_tilt
        data:
          value: "{{ t }}"
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.detect_torreta_pan

  # Un paso relativo para los botones de flecha. Parte de los sliders y no de
  # sensor.detect_torreta_pan/tilt: HA limita los refrescos forzados de un
  # sensor rest a uno cada 10 s, así que con varios clics seguidos el sensor
  # seguía en la posición vieja y cada flecha repetía la misma orden.
  detect_torreta_step:
    alias: "Detect torreta: paso"
    icon: mdi:arrow-decision
    mode: queued
    fields:
      d_pan:
        description: "Incremento horizontal"
        example: 0.1
      d_tilt:
        description: "Incremento vertical"
        example: 0
    sequence:
      - action: script.detect_torreta_move
        data:
          pan: "{{ states('input_number.detect_torreta_pan') | float(0) + d_pan | default(0) | float }}"
          tilt: "{{ states('input_number.detect_torreta_tilt') | float(0) + d_tilt | default(0) | float }}"

  detect_torreta_center:
    alias: "Detect torreta: centrar"
    icon: mdi:image-filter-center-focus
    mode: restart
    sequence:
      - action: script.detect_torreta_move
        data:
          pan: 0
          tilt: 0

automation:
  # Sliders -> torreta. Solo manda si el slider difiere de la posición que
  # reporta el servicio: así la sincronización de abajo (y el propio
  # seguimiento moviendo la torreta) no provoca órdenes de rebote.
  - id: detect_torreta_slider_move
    alias: "Detect torreta: mover con los sliders"
    mode: restart
    triggers:
      - trigger: state
        entity_id:
          - input_number.detect_torreta_pan
          - input_number.detect_torreta_tilt
    conditions:
      - condition: template
        value_template: >-
          {{ (states('input_number.detect_torreta_pan') | float(0)
              - states('sensor.detect_torreta_pan') | float(0)) | abs > 0.02
             or (states('input_number.detect_torreta_tilt') | float(0)
              - states('sensor.detect_torreta_tilt') | float(0)) | abs > 0.02 }}
    actions:
      # Espera a que se suelte el slider antes de mandar.
      - delay: "00:00:00.5"
      - action: script.detect_torreta_move
        data:
          pan: "{{ states('input_number.detect_torreta_pan') | float(0) }}"
          tilt: "{{ states('input_number.detect_torreta_tilt') | float(0) }}"

  # Torreta -> sliders.
  - id: detect_torreta_slider_sync
    alias: "Detect torreta: sincronizar sliders"
    mode: queued
    triggers:
      - trigger: state
        entity_id:
          - sensor.detect_torreta_pan
          - sensor.detect_torreta_tilt
      - trigger: homeassistant
        event: start
    conditions:
      - condition: template
        value_template: >-
          {{ states('sensor.detect_torreta_pan') | is_number
             and states('sensor.detect_torreta_tilt') | is_number }}
    actions:
      - action: input_number.set_value
        target:
          entity_id: input_number.detect_torreta_pan
        data:
          value: "{{ states('sensor.detect_torreta_pan') | float }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.detect_torreta_tilt
        data:
          value: "{{ states('sensor.detect_torreta_tilt') | float }}"

  - id: detect_torreta_confidence_push
    alias: "Detect torreta: enviar confianza"
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_number.detect_torreta_confidence
    conditions:
      - condition: template
        value_template: >-
          {{ (states('input_number.detect_torreta_confidence') | float(0)
              - states('sensor.detect_torreta_confidence') | float(0)) | abs > 0.001 }}
    actions:
      - delay: "00:00:01"
      - action: rest_command.detect_torreta_inference
        data:
          body:
            confidence: "{{ states('input_number.detect_torreta_confidence') | float }}"
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.detect_torreta_confidence

  - id: detect_torreta_confidence_sync
    alias: "Detect torreta: sincronizar confianza"
    mode: queued
    triggers:
      - trigger: state
        entity_id: sensor.detect_torreta_confidence
      - trigger: homeassistant
        event: start
    conditions:
      - condition: template
        value_template: "{{ states('sensor.detect_torreta_confidence') | is_number }}"
    actions:
      - action: input_number.set_value
        target:
          entity_id: input_number.detect_torreta_confidence
        data:
          value: "{{ states('sensor.detect_torreta_confidence') | float }}"

  # Modelo e imgsz -> servicio. Solo manda lo que difiere de lo que reporta,
  # para que la sincronización de abajo no provoque rebotes.
  - id: detect_torreta_inference_push
    alias: "Detect torreta: enviar modelo e imgsz"
    mode: queued
    triggers:
      - trigger: state
        entity_id: input_select.detect_torreta_model
        id: model
      - trigger: state
        entity_id: input_select.detect_torreta_imgsz
        id: imgsz
    variables:
      body: >-
        {%- set s = 'sensor.detect_torreta_confidence' -%}
        {%- set model = states('input_select.detect_torreta_model') -%}
        {%- set imgsz = states('input_select.detect_torreta_imgsz') | int -%}
        {%- if trigger.id == 'model' and model != state_attr(s, 'model_name') -%}
        {{ {'model_name': model} }}
        {%- elif trigger.id == 'imgsz' and imgsz != state_attr(s, 'imgsz') -%}
        {{ {'imgsz': imgsz} }}
        {%- else -%}
        {{ {} }}
        {%- endif -%}
    conditions:
      - condition: template
        value_template: "{{ body | count > 0 }}"
    actions:
      - action: rest_command.detect_torreta_inference
        data:
          body: "{{ body }}"
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.detect_torreta_confidence

  # Servicio -> desplegables. Un valor que no esté entre las opciones (un
  # modelo puesto desde Swagger) deja el desplegable como está.
  - id: detect_torreta_inference_sync
    alias: "Detect torreta: sincronizar modelo e imgsz"
    mode: queued
    triggers:
      - trigger: state
        entity_id: sensor.detect_torreta_confidence
        attribute: model_name
      - trigger: state
        entity_id: sensor.detect_torreta_confidence
        attribute: imgsz
      - trigger: homeassistant
        event: start
    variables:
      model: "{{ state_attr('sensor.detect_torreta_confidence', 'model_name') }}"
      # Las variables vuelven a número al renderizar: se pasa a texto al usarla.
      imgsz: "{{ state_attr('sensor.detect_torreta_confidence', 'imgsz') }}"
    actions:
      - if: "{{ model in state_attr('input_select.detect_torreta_model', 'options') }}"
        then:
          - action: input_select.select_option
            target:
              entity_id: input_select.detect_torreta_model
            data:
              option: "{{ model }}"
      - if: "{{ imgsz | string in state_attr('input_select.detect_torreta_imgsz', 'options') }}"
        then:
          - action: input_select.select_option
            target:
              entity_id: input_select.detect_torreta_imgsz
            data:
              option: "{{ imgsz | string }}"

  # Casillas de clases -> servicio. Solo los cambios hechos a mano: los que hace
  # la sincronización de abajo vienen de una automatización (parent_id) y no
  # deben reenviarse, o se perderían las clases que no tienen casilla.
  # El from/to deja fuera la creación de las casillas al recargar: nacen
  # apagadas y, sin él, eso se mandaba como "todas las clases".
  - id: detect_torreta_classes_push
    alias: "Detect torreta: enviar clases"
    mode: restart
    triggers:
      - trigger: state
        entity_id:
          - input_boolean.detect_torreta_class_person
          - input_boolean.detect_torreta_class_car
          - input_boolean.detect_torreta_class_bird
          - input_boolean.detect_torreta_class_cat
          - input_boolean.detect_torreta_class_dog
        from: ["on", "off"]
        to: ["on", "off"]
    conditions:
      - condition: template
        value_template: "{{ trigger.to_state.context.parent_id is none }}"
    actions:
      # Agrupa varios clics seguidos en un solo envío.
      - delay: "00:00:01"
      - variables:
          classes: >-
            {%- set ids = {'person': 0, 'car': 2, 'bird': 14, 'cat': 15, 'dog': 16} -%}
            {%- set ns = namespace(l=[]) -%}
            {%- for k, v in ids.items() if is_state('input_boolean.detect_torreta_class_' ~ k, 'on') -%}
            {%- set ns.l = ns.l + [v] -%}
            {%- endfor -%}
            {{ ns.l | sort if ns.l else none }}
      - condition: template
        value_template: "{{ classes != state_attr('sensor.detect_torreta_confidence', 'classes') }}"
      - action: rest_command.detect_torreta_inference
        data:
          body:
            classes: "{{ classes }}"
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.detect_torreta_confidence

  # Servicio -> casillas. classes null (todas) = ninguna marcada.
  - id: detect_torreta_classes_sync
    alias: "Detect torreta: sincronizar clases"
    mode: queued
    triggers:
      - trigger: state
        entity_id: sensor.detect_torreta_confidence
        attribute: classes
      - trigger: homeassistant
        event: start
    conditions:
      - condition: template
        value_template: "{{ states('sensor.detect_torreta_confidence') | is_number }}"
    variables:
      classes: "{{ state_attr('sensor.detect_torreta_confidence', 'classes') or [] }}"
    actions:
      - repeat:
          for_each:
            - { key: person, id: 0 }
            - { key: car, id: 2 }
            - { key: bird, id: 14 }
            - { key: cat, id: 15 }
            - { key: dog, id: 16 }
          sequence:
            - action: "input_boolean.turn_{{ 'on' if repeat.item.id in classes else 'off' }}"
              target:
                entity_id: "input_boolean.detect_torreta_class_{{ repeat.item.key }}"
